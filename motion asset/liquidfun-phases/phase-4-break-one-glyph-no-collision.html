<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3 — break one glyph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "genwanlatin";
      font-weight: 400;
      font-style: normal;
      src: url("https://freight.cargo.site/m/K2650652186881166999210129014453/genwan_latin_092725_1-r-webfont.woff2") format("woff2");
    }
    :root {
      --bg:     #e6e6e6;
      --ink:    #141414;
      --border: rgba(0,0,0,0.14);
      --muted:  rgba(0,0,0,0.42);
    }
    html { font-size: 18px; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .demo-root {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .demo-toolbar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      row-gap: 10px;
      padding: 10px 12px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid var(--border);
    }

    .demo-main {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .demo-main canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
      vertical-align: middle;
    }

    .demo-meta {
      flex: 1 1 100%;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    button {
      padding: 6px 14px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
    }
    button:hover { color: var(--ink); border-color: rgba(0,0,0,0.28); }
    label { font-size: 1rem; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
    input {
      width: 40px;
      padding: 4px 8px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      text-align: center;
    }
    input:focus { outline: none; border-color: rgba(0,0,0,0.28); }
    main { display: block; }

    @media (max-width: 520px) {
      html { font-size: 15px; }
      .demo-toolbar { padding: 8px 10px; }
      button { padding: 8px 12px; font-size: 0.88rem; }
      label { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div class="demo-root">
    <div class="demo-toolbar">
      <div class="row">
        <button id="breakBtn" type="button">Break Glyph</button>
        <button id="resetBtn" type="button">Reset</button>
        <label>A–Z / a–z <input id="glyphInput" maxlength="1" value="S" title="English letter only" /></label>
      </div>
      <span id="particleInfo" class="demo-meta"></span>
    </div>
    <main class="demo-main"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="../lib/liquidfun.js"></script>
  <script>
    // Particle system matches initDemoWorld. Glyph = many CreateParticleGroup(circle) patches (same as world
    // blob API); binding has no arbitrary polygon fill. Patch radius ~fraction of canvas like world’s 0.07·min.
    var CFG = {
      gravityY: 32,
      radius: 3.2,
      /** Fill disk radius per group (world-only single blob uses ~0.07·min); smaller = more patches, smoother S. */
      groupPatchRadiusFrac: 0.028,
      dampingStrength: 0.6,
      viscousStrength: 0.2,
      elasticStrength: 0.01,
      springStrength: 0.01,
      repulsiveStrength: 0.0,
      pressureStrength: 0.014,
      powderStrength: 0.06,
      surfaceTensionNormalStrength: 0.02,
      surfaceTensionPressureStrength: 0.02,
      setDamping: 0.72,
      wallFriction: 0.35,
      wallRestitution: 0.20,
      stepVelIters: 17,
      stepPosIters: 6,
      simSpeed: 5,
      airDrag: 0.005,
      upwardExtraDrag: 0.02,
      /** World units subtracted from wall radius when fitting (patch extent + slack). */
      fitWallInset: 6,
      /** Physics steps after spawn so fluid packs slightly, then mask-trim runs (before break). */
      trimSettleSteps: 5,
      /** DestroyParticlesInShape radius as fraction of particle radius (small = one-at-a-time, keeps groups intact). */
      trimKillRadiusFrac: 0.52,
      /** Draw: particle fill alpha (speed still adds on top within min–max). */
      particleAlphaBase: 118,
      particleAlphaSpeedScale: 36,
      particleAlphaMin: 85,
      particleAlphaMax: 228,
      /** Pre-break glyph: outline alpha (fill stays solid white). */
      silhouetteOutlineAlpha: 255,
      silhouetteFillAlpha: 255,
      /** After Break: particles ramp from invisible to full draw alpha (ms). */
      postBreakFadeInMs: 320,
      /** Before Break: multiply particle alpha by this (0 = invisible under glyph). */
      preBreakParticleOpacity: 0,
      /** Top→bottom cascade: ms from first release (top) to last (bottom). */
      fallStaggerMs: 880,
      /** Per-particle spread so the front isn’t a perfect line (ms ±). */
      fallStaggerJitterMs: 48,
      /** >1 stretches lower rows later (more gradual tail). */
      fallStaggerEase: 1.22,
      /** Optional ms after last particle releases before glyph overlay hits alpha 0 (0 = gone exactly at last release). */
      glyphFadeOutTailMs: 140,
    };

    var world;
    var particleSystem;
    var phase4 = {
      wallsReady: false,
      cx: 0,
      cy: 0,
      r: 0,
      glyph: 'S',
      glyphCenterX: 0,
      glyphCenterY: 0,
      glyphPoints: [],
      glyphEmitIndex: 0,
      isBreaking: false,
      /** millis() when break started; used only while isBreaking. */
      breakFadeStartMs: -1,
      groupPatchRadius: 14,
      glyphMaskGfx: null,
      glyphDrawS: 1,
      glyphBboxCx: 0,
      glyphBboxCy: 0,
      /** Uint8Array[gfx.w*gfx.h], 1 = ink (same threshold as sampling). */
      glyphMaskHit: null,
      trimmedParticleCount: 0,
      /** Pinned Box2D coords until fallReleaseAtMs[k]; set at break only. */
      fallPinPx: null,
      fallPinPy: null,
      fallReleaseAtMs: null,
      /** max(fallReleaseAtMs); glyph overlay fully faded by this + tail. */
      fallLastReleaseMs: -1,
    };

    /** Max CreateParticleGroup calls (each patch relaxes like world-only disk). */
    var MAX_PATCH_GROUPS = 220;

    /** Spec title font (same as index / media_motion_01 .brand / .project-title). Loaded via @font-face above. */
    var SPEC_TITLE_FONT = 'genwanlatin';
    /** True after first glyph build once genwanlatin is actually active (avoids wrong mask on slow font load). */
    var specFontGlyphPrimed = false;

    function applySpecTitleFont(g) {
      if (g) g.textFont(SPEC_TITLE_FONT);
      else textFont(SPEC_TITLE_FONT);
    }

    function specFontReady() {
      if (!document.fonts) return true;
      try {
        return document.fonts.check('400 124px ' + SPEC_TITLE_FONT);
      } catch (e) {
        return true;
      }
    }

    function setup() {
      var cnv = createCanvas(540, 540);
      pixelDensity(1);
      var mainEl = document.querySelector('main');
      if (mainEl && cnv && cnv.parent) cnv.parent(mainEl);
      initWorld();
      wireUI();
      applySpecTitleFont();
      if (specFontReady()) {
        prepareGlyph(getGlyph());
        specFontGlyphPrimed = true;
      }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('400 124px ' + SPEC_TITLE_FONT).catch(function () {});
      }
    }

    function createParticleSystemDef(LF) {
      var psd = new LF.b2ParticleSystemDef();
      psd.radius = CFG.radius;
      psd.dampingStrength = CFG.dampingStrength;
      psd.viscousStrength = CFG.viscousStrength;
      psd.elasticStrength = CFG.elasticStrength;
      psd.springStrength = CFG.springStrength;
      psd.repulsiveStrength = CFG.repulsiveStrength;
      psd.pressureStrength = CFG.pressureStrength;
      psd.powderStrength = CFG.powderStrength;
      psd.surfaceTensionNormalStrength = CFG.surfaceTensionNormalStrength;
      psd.surfaceTensionPressureStrength = CFG.surfaceTensionPressureStrength;
      return psd;
    }

    function initWorld() {
      var LF = window.liquidfun;
      // Start with no gravity so pre-spawned particles stay under silhouette until "Break Glyph".
      world = new LF.b2World(new LF.b2Vec2(0, 0));
      particleSystem = world.CreateParticleSystem(createParticleSystemDef(LF));
      particleSystem.SetDamping(CFG.setDamping);
      particleSystem.SetRadius(CFG.radius);

      phase4.cx = width / 2;
      phase4.cy = height / 2;
      phase4.r = Math.min(width, height) * 0.38;
      addCircleWall(phase4.cx, phase4.cy, phase4.r);
      phase4.groupPatchRadius = Math.min(width, height) * CFG.groupPatchRadiusFrac;
      phase4.wallsReady = true;
    }

    function addCircleWall(cx, cy, r) {
      var LF = window.liquidfun;
      var chain = new LF.b2ChainShape();
      var segs = 56;
      for (var i = 0; i < segs; i++) {
        var a = (i / segs) * Math.PI * 2;
        var x = cx + Math.cos(a) * r;
        var y = cy + Math.sin(a) * r;
        chain.vertices.push(new LF.b2Vec2(x, -y));
      }
      chain.CreateLoop();
      var bd = new LF.b2BodyDef();
      bd.position = new LF.b2Vec2(0, 0);
      var body = world.CreateBody(bd);
      var fd = new LF.b2FixtureDef();
      fd.shape = chain;
      fd.friction = CFG.wallFriction;
      fd.restitution = CFG.wallRestitution;
      fd.density = 0;
      window.world = world;
      body.CreateFixtureFromDef(fd);
    }

    function getGlyph() {
      var v = (document.getElementById('glyphInput').value || 'S').trim();
      var ch = v.length ? v[0] : 'S';
      if (!/[A-Za-z]/.test(ch)) return 'S';
      return ch;
    }

    function scanGlyphBBox(g, threshold) {
      var minX = g.width;
      var maxX = -1;
      var minY = g.height;
      var maxY = -1;
      for (var y = 0; y < g.height; y++) {
        for (var x = 0; x < g.width; x++) {
          var idx = (y * g.width + x) * 4 + 3;
          if (g.pixels[idx] < threshold) continue;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
      if (maxX < 0) return null;
      return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
    }

    /** Max distance from wall center to any bbox corner after scaling ink from pixel anchor (cx_pix,cy_pix) to world (gx,gy). */
    function maxCornerDistFromWall(gx, gy, cx_pix, cy_pix, bbox, s, WCx, WCy) {
      var c = [
        [bbox.minX, bbox.minY],
        [bbox.maxX, bbox.minY],
        [bbox.minX, bbox.maxY],
        [bbox.maxX, bbox.maxY],
      ];
      var m = 0;
      for (var i = 0; i < 4; i++) {
        var wx = gx + (c[i][0] - cx_pix) * s;
        var wy = gy + (c[i][1] - cy_pix) * s;
        var d = Math.hypot(wx - WCx, wy - WCy);
        if (d > m) m = d;
      }
      return m;
    }

    /** Largest uniform scale s so all corners stay inside wall circle (radius innerR). */
    function computeFitScale(gx, gy, WCx, WCy, innerR, cx_pix, cy_pix, bbox) {
      if (innerR <= 1 || !bbox) return 0.25;
      function maxD(s) {
        return maxCornerDistFromWall(gx, gy, cx_pix, cy_pix, bbox, s, WCx, WCy);
      }
      if (maxD(0) > innerR) return 0.08;
      var lo = 0;
      var hi = 0.25;
      for (var k = 0; k < 14; k++) {
        if (maxD(hi) > innerR) break;
        lo = hi;
        hi *= 1.35;
        if (hi > 80) break;
      }
      if (maxD(hi) <= innerR) return hi;
      for (var iter = 0; iter < 36; iter++) {
        var mid = (lo + hi) * 0.5;
        if (maxD(mid) <= innerR) lo = mid;
        else hi = mid;
      }
      return lo;
    }

    function cacheGlyphMaskHit(gfx, threshold) {
      var w = gfx.width;
      var h = gfx.height;
      var hit = new Uint8Array(w * h);
      gfx.loadPixels();
      for (var yy = 0; yy < h; yy++) {
        for (var xx = 0; xx < w; xx++) {
          var a = gfx.pixels[(yy * w + xx) * 4 + 3];
          hit[yy * w + xx] = a >= threshold ? 1 : 0;
        }
      }
      phase4.glyphMaskHit = hit;
    }

    /** p5 coords: x right, y down; matches draw() mapping from Box2D (y flip). */
    function worldP5PointInsideGlyph(pxP5, pyP5) {
      var g = phase4.glyphMaskGfx;
      var hit = phase4.glyphMaskHit;
      if (!g || !hit || !hit.length) return false;
      var s = phase4.glyphDrawS;
      if (s < 1e-9) return false;
      var gx = phase4.glyphCenterX;
      var gy = phase4.glyphCenterY;
      var cxp = phase4.glyphBboxCx;
      var cyp = phase4.glyphBboxCy;
      var px = (pxP5 - gx) / s + cxp;
      var py = (pyP5 - gy) / s + cyp;
      var ix = Math.floor(px);
      var iy = Math.floor(py);
      if (ix < 0 || iy < 0 || ix >= g.width || iy >= g.height) return false;
      return hit[iy * g.width + ix] !== 0;
    }

    /**
     * Remove particles whose centers map outside the glyph mask (after brief settle).
     * Uses DestroyParticlesInShape (tiny disk) so original CreateParticleGroup membership
     * and fluid cohesion stay intact — unlike DestroyParticleSystem + CreateParticle.
     */
    function trimParticlesToGlyphMask() {
      if (!world || !particleSystem) return;
      var LF = window.liquidfun;
      var xf = new LF.b2Transform();
      xf.SetIdentity();
      var pr = particleSystem.radius;
      var killR = Math.max(pr * CFG.trimKillRadiusFrac, 1e-4);
      var maxIter = 250000;
      var iter = 0;
      while (iter++ < maxIter) {
        var pos = particleSystem.GetPositionBuffer();
        if (!pos || pos.length < 2) break;
        var bx = null;
        var by = null;
        for (var i = 0; i < pos.length; i += 2) {
          var px = pos[i];
          var py = pos[i + 1];
          if (!worldP5PointInsideGlyph(px, -py)) {
            bx = px;
            by = py;
            break;
          }
        }
        if (bx === null) break;
        var circle = new LF.b2CircleShape();
        circle.position.Set(bx, by);
        circle.radius = killR;
        var removed = particleSystem.DestroyParticlesInShape(circle, xf);
        if (!removed) {
          circle.radius = killR * 1.35;
          removed = particleSystem.DestroyParticlesInShape(circle, xf);
        }
        if (!removed) break;
      }
      var posFinal = particleSystem.GetPositionBuffer();
      phase4.trimmedParticleCount = posFinal ? posFinal.length >> 1 : 0;
    }

    function buildGlyphPoints(ch) {
      if (!phase4.wallsReady) return;
      if (phase4.glyphMaskGfx) {
        phase4.glyphMaskGfx.remove();
        phase4.glyphMaskGfx = null;
      }

      var g = createGraphics(170, 170);
      g.pixelDensity(1);
      g.clear();
      g.noStroke();
      g.fill(255);
      g.textAlign(CENTER, CENTER);
      applySpecTitleFont(g);
      g.textSize(124);
      g.textStyle(NORMAL);
      g.text(ch, g.width / 2, g.height / 2 + 6);
      g.loadPixels();

      var centerX = phase4.cx;
      var centerY = phase4.cy - phase4.r * 0.34;
      var step = 1;
      var threshold = 140;
      var bbox = scanGlyphBBox(g, threshold);
      var cx_pix = g.width / 2;
      var cy_pix = g.height / 2;
      if (!bbox) {
        phase4.glyphMaskGfx = g;
        phase4.glyphDrawS = 1;
        phase4.glyphBboxCx = cx_pix;
        phase4.glyphBboxCy = cy_pix;
        phase4.glyphMaskHit = null;
        return [];
      }
      cx_pix = (bbox.minX + bbox.maxX) * 0.5;
      cy_pix = (bbox.minY + bbox.maxY) * 0.5;

      var patchR = phase4.groupPatchRadius || Math.min(width, height) * CFG.groupPatchRadiusFrac;
      var innerR = Math.max(phase4.r - patchR - CFG.fitWallInset, phase4.r * 0.25);
      var s = computeFitScale(centerX, centerY, phase4.cx, phase4.cy, innerR, cx_pix, cy_pix, bbox);

      phase4.glyphMaskGfx = g;
      phase4.glyphDrawS = s;
      phase4.glyphBboxCx = cx_pix;
      phase4.glyphBboxCy = cy_pix;
      cacheGlyphMaskHit(g, threshold);

      var pts = [];
      for (var y = 0; y < g.height; y += step) {
        for (var x = 0; x < g.width; x += step) {
          var idx = (y * g.width + x) * 4 + 3;
          if (g.pixels[idx] < threshold) continue;
          var wx = centerX + (x - cx_pix) * s;
          var wy = centerY + (y - cy_pix) * s;
          pts.push({ x: wx, y: wy });
        }
      }
      shuffleArray(pts);
      var minSep = patchR * 2.02;
      var minSep2 = minSep * minSep;
      var spaced = [];
      for (var pi = 0; pi < pts.length; pi++) {
        var q = pts[pi];
        var ok = true;
        for (var sj = 0; sj < spaced.length; sj++) {
          var ddx = q.x - spaced[sj].x;
          var ddy = q.y - spaced[sj].y;
          if (ddx * ddx + ddy * ddy < minSep2) {
            ok = false;
            break;
          }
        }
        if (ok) spaced.push(q);
      }
      pts = spaced;
      if (pts.length > MAX_PATCH_GROUPS) {
        shuffleArray(pts);
        pts.length = MAX_PATCH_GROUPS;
      }
      return pts;
    }

    function shuffleArray(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0;
        var t = arr[i];
        arr[i] = arr[j];
        arr[j] = t;
      }
    }

    function prepareGlyph(ch) {
      phase4.glyph = ch;
      phase4.glyphCenterX = phase4.cx;
      phase4.glyphCenterY = phase4.cy - phase4.r * 0.34;
      phase4.glyphPoints = buildGlyphPoints(ch) || [];
      shuffleArray(phase4.glyphPoints);
      phase4.glyphEmitIndex = phase4.glyphPoints.length;
      phase4.isBreaking = false;
      phase4.breakFadeStartMs = -1;
      phase4.fallPinPx = null;
      phase4.fallPinPy = null;
      phase4.fallReleaseAtMs = null;
      phase4.fallLastReleaseMs = -1;
      spawnGlyphParticleGroups();
      var ts = CFG.trimSettleSteps | 0;
      for (var st = 0; st < ts; st++) {
        world.Step(1 / 60, CFG.stepVelIters, CFG.stepPosIters);
      }
      trimParticlesToGlyphMask();
      var el = document.getElementById('particleInfo');
      if (el) {
        var pr = phase4.groupPatchRadius.toFixed(1);
        el.textContent =
          phase4.glyphPoints.length +
          ' patches · ' +
          phase4.trimmedParticleCount +
          ' particles (mask-trimmed) · r=' +
          pr +
          ' · fit s=' +
          phase4.glyphDrawS.toFixed(3) +
          ' · cap ' +
          MAX_PATCH_GROUPS;
      }
    }

    function startGlyphDisintegration(ch) {
      if (ch !== phase4.glyph) prepareGlyph(ch);
      phase4.isBreaking = true;
      phase4.breakFadeStartMs = millis();
      releasePreSpawnedParticles();
    }

    function spawnGlyphParticleGroups() {
      if (!particleSystem) return;
      var LF = window.liquidfun;
      var patchR = phase4.groupPatchRadius;
      for (var i = 0; i < phase4.glyphPoints.length; i++) {
        var p = phase4.glyphPoints[i];
        var circle = new LF.b2CircleShape();
        circle.position.Set(p.x, -p.y);
        circle.radius = patchR;
        var pgd = new LF.b2ParticleGroupDef();
        pgd.shape = circle;
        pgd.flags = LF.b2_waterParticle;
        pgd.color = new LF.b2ParticleColor(255, 255, 255, 255);
        particleSystem.CreateParticleGroup(pgd);
      }
    }

    function releasePreSpawnedParticles() {
      if (!world || !particleSystem) return;
      world.SetGravity(new window.liquidfun.b2Vec2(0, -CFG.gravityY));
      particleSystem.SetDamping(0.26);
      var pos = particleSystem.GetPositionBuffer();
      var vel = particleSystem.GetVelocityBuffer();
      if (!vel || vel.length < 2 || !pos || pos.length < 2) return;
      for (var i = 0; i < vel.length; i += 2) {
        vel[i] = 0;
        vel[i + 1] = 0;
      }
      var n = pos.length >> 1;
      var minSy = 1e9;
      var maxSy = -1e9;
      var k;
      for (k = 0; k < n; k++) {
        var sy = -pos[k * 2 + 1];
        if (sy < minSy) minSy = sy;
        if (sy > maxSy) maxSy = sy;
      }
      var span = maxSy - minSy;
      var px = new Float32Array(n);
      var py = new Float32Array(n);
      var rel = new Array(n);
      var t0 = phase4.breakFadeStartMs;
      var St = Math.max(1, CFG.fallStaggerMs);
      var jit = Math.max(0, CFG.fallStaggerJitterMs);
      var ease = Math.max(0.35, CFG.fallStaggerEase);
      for (k = 0; k < n; k++) {
        var ii = k * 2;
        px[k] = pos[ii];
        py[k] = pos[ii + 1];
        var sy2 = -pos[ii + 1];
        var u = span < 1e-6 ? random(0, 1) : (sy2 - minSy) / span;
        u = Math.pow(u, ease);
        var ms = t0 + u * St + random(-jit, jit);
        if (ms < t0) ms = t0;
        rel[k] = ms;
      }
      var tMax = t0;
      for (k = 0; k < n; k++) {
        if (rel[k] > tMax) tMax = rel[k];
      }
      phase4.fallPinPx = px;
      phase4.fallPinPy = py;
      phase4.fallReleaseAtMs = rel;
      phase4.fallLastReleaseMs = tMax;
    }

    function drawGlyphSilhouetteImage(outlineAlpha, fillAlpha, extraDyOpt) {
      if (!phase4.glyphMaskGfx) return;
      if (outlineAlpha <= 0 && fillAlpha <= 0) return;
      var yOff = extraDyOpt != null ? extraDyOpt : 0;
      var s = phase4.glyphDrawS;
      var gx = phase4.glyphCenterX;
      var gy = phase4.glyphCenterY;
      var cxp = phase4.glyphBboxCx;
      var cyp = phase4.glyphBboxCy;
      var img = phase4.glyphMaskGfx;
      var dx = gx - cxp * s;
      var dy = gy - cyp * s + yOff;
      var dw = img.width * s;
      var dh = img.height * s;
      var o = Math.max(1, s * 0.12);
      var outline = [
        [-o, 0],
        [o, 0],
        [0, -o],
        [0, o],
        [-o, -o],
        [-o, o],
        [o, -o],
        [o, o],
      ];
      push();
      noStroke();
      if (outlineAlpha > 0) {
        tint(0, 0, 0, constrain(outlineAlpha, 0, 255));
        for (var oi = 0; oi < outline.length; oi++) {
          image(img, dx + outline[oi][0], dy + outline[oi][1], dw, dh);
        }
      }
      if (fillAlpha > 0) {
        tint(255, 255, 255, constrain(fillAlpha, 0, 255));
        image(img, dx, dy, dw, dh);
      }
      noTint();
      pop();
    }

    /**
     * Vertical offset = screen-space center of mass of *released* particles minus their pin snapshot.
     * Matches bulk motion/speed of the moving fluid (not max particle, not full-cloud mean while most are pinned).
     */
    function computeGlyphFollowDy(now) {
      if (!phase4.fallPinPy || !particleSystem || !phase4.fallReleaseAtMs) return 0;
      var pos = particleSystem.GetPositionBuffer();
      var nPin = phase4.fallPinPy.length;
      if (!pos || pos.length < 2 || !phase4.fallPinPx) return 0;
      var n = Math.min(nPin, pos.length >> 1);
      if (n < 1) return 0;
      var sum = 0;
      var sum0 = 0;
      var cnt = 0;
      for (var k = 0; k < n; k++) {
        if (now < phase4.fallReleaseAtMs[k]) continue;
        var sy = -pos[k * 2 + 1];
        var sy0 = -phase4.fallPinPy[k];
        sum += sy;
        sum0 += sy0;
        cnt++;
      }
      if (cnt < 1) return 0;
      return (sum - sum0) / cnt;
    }

    function applyFallStaggerPins() {
      if (!phase4.isBreaking || !phase4.fallPinPx || !particleSystem) return;
      var now = millis();
      var pos = particleSystem.GetPositionBuffer();
      var vbuf = particleSystem.GetVelocityBuffer();
      var n = phase4.fallPinPx.length;
      if (!pos || !vbuf || pos.length < n * 2) return;
      for (var k = 0; k < n; k++) {
        if (now >= phase4.fallReleaseAtMs[k]) continue;
        var i = k * 2;
        pos[i] = phase4.fallPinPx[k];
        pos[i + 1] = phase4.fallPinPy[k];
        vbuf[i] = 0;
        vbuf[i + 1] = 0;
      }
    }

    function resetScene() {
      initWorld();
      applySpecTitleFont();
      prepareGlyph(getGlyph());
      specFontGlyphPrimed = true;
    }

    function wireUI() {
      document.getElementById('breakBtn').addEventListener('click', function () {
        startGlyphDisintegration(getGlyph());
      });
      document.getElementById('resetBtn').addEventListener('click', function () {
        resetScene();
      });
      var gi = document.getElementById('glyphInput');
      if (gi) {
        gi.addEventListener('input', function () {
          var v = (gi.value || '').trim();
          if (!v.length) return;
          var c = v[0];
          if (!/[A-Za-z]/.test(c)) {
            gi.value = phase4.glyph || 'S';
            return;
          }
          gi.value = c;
          if (!phase4.isBreaking) prepareGlyph(c);
        });
        gi.addEventListener('change', function () {
          if (!phase4.isBreaking) prepareGlyph(getGlyph());
        });
      }
    }

    function draw() {
      background(228);

      if (!specFontGlyphPrimed && !phase4.isBreaking) {
        if (specFontReady() || frameCount > 180) {
          prepareGlyph(getGlyph());
          specFontGlyphPrimed = true;
        }
      }

      if (world && particleSystem) {
        // Do not Step before break: g=0 still runs particle-particle pressure/contact
        // every frame, which injects motion into a dense glyph. Freeze sim until release.
        if (phase4.isBreaking) {
          for (var s = 0; s < CFG.simSpeed; s++) {
            world.Step(1 / 60, CFG.stepVelIters, CFG.stepPosIters);
            if (CFG.airDrag > 0 || CFG.upwardExtraDrag > 0) {
              var v = particleSystem.GetVelocityBuffer();
              if (v && v.length >= 2) {
                for (var vi = 0; vi < v.length; vi += 2) {
                  var extra = v[vi + 1] > 0 ? CFG.upwardExtraDrag : 0;
                  var mul = Math.max(0, 1 - CFG.airDrag - extra);
                  v[vi] *= mul;
                  v[vi + 1] *= mul;
                }
              }
            }
            applyFallStaggerPins();
          }
        }

        var pos = particleSystem.GetPositionBuffer();
        var vel = particleSystem.GetVelocityBuffer();
        var r = particleSystem.radius;

        noStroke();
        var particleOpacityMul = 1;
        if (!phase4.isBreaking) {
          particleOpacityMul = constrain(CFG.preBreakParticleOpacity, 0, 1);
        } else if (phase4.breakFadeStartMs >= 0) {
          var dur = Math.max(1, CFG.postBreakFadeInMs);
          var u = (millis() - phase4.breakFadeStartMs) / dur;
          particleOpacityMul = u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
        }
        for (var i = 0; i < pos.length; i += 2) {
          var sx = pos[i];
          var sy = -pos[i + 1];
          var vx = vel[i];
          var vy = vel[i + 1];
          var speed = Math.hypot(vx, vy);
          var alpha = constrain(
            CFG.particleAlphaBase + speed * CFG.particleAlphaSpeedScale,
            CFG.particleAlphaMin,
            CFG.particleAlphaMax
          );
          alpha = constrain(alpha * particleOpacityMul, 0, 255);
          var j = (i >> 1) % 7;
          var vr = 1 + j * 0.02;
          fill(255, 255, 255, alpha);
          circle(sx, sy, r * 2 * vr);
        }

        // Breaking: white glyph on top of particles — same hue, alpha-only fade (no black outline here → no muddy darkening).
        if (phase4.isBreaking && phase4.glyphMaskGfx && phase4.fallLastReleaseMs >= 0) {
          var t0g = phase4.breakFadeStartMs;
          var t1g = phase4.fallLastReleaseMs + Math.max(0, CFG.glyphFadeOutTailMs);
          var nowg = millis();
          var glyphRemain = 1;
          if (nowg >= t1g) glyphRemain = 0;
          else if (nowg > t0g) {
            var ug = (nowg - t0g) / Math.max(1, t1g - t0g);
            var sg = ug * ug * (3 - 2 * ug);
            glyphRemain = 1 - sg;
          }
          if (glyphRemain > 0) {
            var followDy = computeGlyphFollowDy(millis());
            var faBr = Math.round(255 * glyphRemain);
            drawGlyphSilhouetteImage(0, faBr, followDy);
          }
        }
      }

      // Pre-break: solid glyph on top of particles.
      if (!phase4.isBreaking && phase4.glyphMaskGfx) {
        drawGlyphSilhouetteImage(CFG.silhouetteOutlineAlpha, CFG.silhouetteFillAlpha);
      }
    }
  </script>
</body>
</html>
