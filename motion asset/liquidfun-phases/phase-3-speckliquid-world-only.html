<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 3 - SpeckLiquid world only</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:    #ece7de;
      --ink:   #1a1714;
      --muted: rgba(26,23,20,0.38);
    }
    html { font-size: 18px; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 1rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
    p { margin: 0; max-width: 32rem; text-align: center; color: var(--muted); }
    code { font-family: monospace; font-size: 1rem; }
    main { display: block; }
  </style>
</head>
<body>
  <h1>Phase 3 - SpeckLiquid world only</h1>
  <p>Uses <code>SpecSpeckLiquid.initDemoWorld</code> (no Matter, no sketch.js).</p>
  <main></main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="../lib/liquidfun.js"></script>
  <script src="../speckLiquidFun.js"></script>
  <script src="../liquidfunDemo.js"></script>
</body>
</html>
