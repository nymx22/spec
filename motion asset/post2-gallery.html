<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Venn Diagram (Frames)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="inkBlob.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #fff;
    }

    .demo-root {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .demo-main {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .demo-main canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
      vertical-align: middle;
    }

    main { display: block; }

    .demo-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #eee;
      user-select: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      appearance: none;
      border: 1px solid #ddd;
      background: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font: 14px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .counter {
      font: 14px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #333;
      min-width: 60px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .demo-toolbar { padding: 10px 12px; }
      button { padding: 8px 12px; font-size: 13px; }
      .counter { font-size: 13px; min-width: 52px; }
    }
  </style>
</head>

<body>
  <div class="demo-root">
    <main class="demo-main"></main>
    <div class="demo-toolbar">
      <div class="controls">
        <button id="prev" type="button">Prev</button>
        <div id="counter" class="counter">1 / 2</div>
        <button id="next" type="button">Next</button>
      </div>
    </div>
  </div>
  <script>
    window.__SPEC_GALLERY__ = true;
    window.__SPEC_GALLERY_FRAME__ = 1;

    const TOTAL_FRAMES = 5;
    const counterEl = document.getElementById('counter');

    function updateUI() {
      const f = window.__SPEC_GALLERY_FRAME__ || 1;
      counterEl.textContent = `${f} / ${TOTAL_FRAMES}`;
    }

    function gotoFrame(delta) {
      const cur = window.__SPEC_GALLERY_FRAME__ || 1;
      const f = Math.max(1, Math.min(TOTAL_FRAMES, cur + delta));
      window.__SPEC_GALLERY_FRAME__ = f;
      updateUI();
      if (typeof window.redraw === 'function') window.redraw();
    }

    document.getElementById('prev').addEventListener('click', () => gotoFrame(-1));
    document.getElementById('next').addEventListener('click', () => gotoFrame(1));
    updateUI();
  </script>
  <script src="sketch.js"></script>
</body>

</html>
