<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>post1.2 — media_motion_01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #e4e4e4;
      --ink:    #141414;
      --border: rgba(0,0,0,0.12);
      --muted:  rgba(0,0,0,0.42);
      --sidebar-w: 270px;
      --mobile-break: 768px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 18px; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .shell {
      display: flex;
      height: 100%;
      height: 100dvh;
      min-height: 0;
    }

    .sidebar-scrim {
      display: none;
    }

    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--bg);
    }

    .sidebar-header {
      padding: 1.6rem 1.4rem 1rem;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.15s;
      margin-bottom: 1rem;
    }
    .back-link:hover { color: var(--ink); }
    .back-link-arrow { font-size: 1rem; }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-count {
      font-size: 1rem;
      color: var(--muted);
      opacity: 0.6;
      margin-top: 0.2rem;
    }

    .nav-list {
      padding: 0.6rem 0;
      flex: 1;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.9rem 1.4rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.13s, border-color 0.13s;
      text-decoration: none;
      color: inherit;
    }

    .nav-item:hover {
      background: rgba(0,0,0,0.05);
    }

    .nav-item.active {
      border-left-color: var(--ink);
      background: rgba(0,0,0,0.07);
    }

    .nav-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .nav-num {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.3;
    }

    .nav-item:not(.active) .nav-num {
      color: var(--muted);
    }

    .nav-status {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.1rem 0.5rem 0.14rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-live {
      background: rgba(0,0,0,0.06);
      color: rgba(0,0,0,0.5);
    }

    .status-dev {
      background: rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.55);
    }

    .status-wip {
      background: rgba(0,0,0,0.12);
      color: rgba(0,0,0,0.72);
    }

    .nav-desc {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .preview-bar {
      padding: 0.7rem 1.4rem;
      padding-top: max(0.7rem, env(safe-area-inset-top, 0px));
      padding-left: max(1.4rem, env(safe-area-inset-left, 0px));
      padding-right: max(1.4rem, env(safe-area-inset-right, 0px));
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
      background: var(--bg);
    }

    .sidebar-toggle {
      display: none;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin: -6px 0 -6px -8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s;
    }

    .sidebar-toggle:hover {
      background: rgba(0,0,0,0.06);
    }

    .sidebar-toggle svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .preview-bar-text {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
      flex: 1;
    }

    .preview-label {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }

    .preview-name {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-sep { color: var(--border); font-size: 1rem; flex-shrink: 0; }

    iframe {
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      border: none;
      background: var(--bg);
    }

    @media (max-width: 768px) {
      .sidebar-toggle {
        display: flex;
      }

      aside {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(300px, 88vw);
        max-width: var(--sidebar-w);
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: none;
      }

      .shell.sidebar-open aside {
        transform: translateX(0);
        box-shadow: 12px 0 40px rgba(0,0,0,0.14);
      }

      .sidebar-scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 35;
        background: rgba(0,0,0,0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .shell.sidebar-open .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .preview {
        width: 100%;
      }

      .preview-bar {
        padding-left: max(0.5rem, env(safe-area-inset-left, 0px));
      }
    }
  </style>
</head>
<body>

<div class="shell" id="shell">

  <button type="button"
          class="sidebar-scrim"
          id="sidebarScrim"
          aria-label="Close menu"
          tabindex="-1"></button>

  <aside id="sidebar" aria-label="Testing navigation">
    <div class="sidebar-header">
      <a class="back-link" href="overview.html">
        <span class="back-link-arrow">←</span> media_motion_01
      </a>
      <div class="sidebar-title">post1.2</div>
      <div class="nav-count">1 · 2</div>
    </div>

    <nav class="nav-list">

      <a class="nav-item active"
         href="#gallery"
         data-src="post2-gallery.html"
         data-name="1 — p5.js matter.js"
         data-slug="gallery">
        <div class="nav-item-top">
          <span class="nav-num">1</span>
          <span class="nav-status status-live">live</span>
        </div>
        <span class="nav-desc">Venn frames — Matter.js speck, ink, transitions</span>
      </a>

      <a class="nav-item"
         href="#liquidfun"
         data-src="liquidfun-phases/liquidfun-gallery.html"
         data-name="2 — LiquidFun"
         data-slug="liquidfun">
        <div class="nav-item-top">
          <span class="nav-num">2</span>
          <span class="nav-status status-dev">dev</span>
        </div>
        <span class="nav-desc">LiquidFun gallery — world, glyph break, speck word (arrows; shareable # per demo)</span>
      </a>

    </nav>
  </aside>

  <div class="preview">
    <div class="preview-bar">
      <button type="button"
              class="sidebar-toggle"
              id="sidebarToggle"
              aria-expanded="false"
              aria-controls="sidebar"
              title="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="preview-bar-text">
        <span class="preview-label">post1.2</span>
        <span class="preview-sep">/</span>
        <span class="preview-name" id="previewName">1 — p5.js matter.js</span>
      </div>
    </div>
    <iframe id="previewFrame"
            src="post2-gallery.html"
            title="post1.2 preview">
    </iframe>
  </div>

</div>

<script>
  (function () {
    var shell = document.getElementById('shell');
    var toggle = document.getElementById('sidebarToggle');
    var scrim = document.getElementById('sidebarScrim');
    var items = document.querySelectorAll('.nav-item');
    var frame = document.getElementById('previewFrame');
    var nameEl = document.getElementById('previewName');

    var mq = window.matchMedia('(max-width: 768px)');

    /** Short links: post1-2.html#1 #2 plus aliases. Deep links to LiquidFun slides: #liquidfun-world, #glyph-break, #speck-word (still work; load gallery iframe with that hash). */
    var LIQUIDFUN_SLUG = 'liquidfun';
    var SLUG_ALIASES = {
      '1': 'gallery',
      p5: 'gallery',
      matter: 'gallery',
      '2': 'liquidfun',
      liquidfun: 'liquidfun',
      '3': 'glyph-break',
      '4': 'speck-word',
      world: 'liquidfun-world',
      liquid: 'liquidfun-world',
      glyph: 'glyph-break',
      break: 'glyph-break',
      speck: 'speck-word',
    };

    function isLiquidfunSubslug(s) {
      return s === 'liquidfun-world' || s === 'glyph-break' || s === 'speck-word';
    }

    function canonicalSlug(raw) {
      if (!raw) return '';
      var k = String(raw).toLowerCase().trim();
      return SLUG_ALIASES[k] || k;
    }

    function itemForSlug(slug) {
      slug = canonicalSlug(slug);
      if (!slug) return null;
      if (slug === LIQUIDFUN_SLUG || isLiquidfunSubslug(slug)) {
        for (var j = 0; j < items.length; j++) {
          if (items[j].getAttribute('data-slug') === LIQUIDFUN_SLUG) return items[j];
        }
      }
      for (var i = 0; i < items.length; i++) {
        if (items[i].getAttribute('data-slug') === slug) return items[i];
      }
      return null;
    }

    function defaultItem() {
      return items[0];
    }

    function applyItem(item, options) {
      options = options || {};
      if (!item) item = defaultItem();
      items.forEach(function (i) { i.classList.remove('active'); });
      item.classList.add('active');
      var src = item.getAttribute('data-src');
      var rawHash = (location.hash || '').replace(/^#/, '').trim();
      var c = canonicalSlug(rawHash);
      if (item.getAttribute('data-slug') === LIQUIDFUN_SLUG) {
        var sub = 'liquidfun-world';
        if (isLiquidfunSubslug(c)) sub = c;
        else if (c === LIQUIDFUN_SLUG) sub = 'liquidfun-world';
        var base = src.split('#')[0];
        src = base + '#' + sub;
      }
      frame.src = src;
      nameEl.textContent = item.getAttribute('data-name');
      if (options.closeMobile && mq.matches) setOpen(false);
    }

    function syncFromHash(options) {
      options = options || {};
      var raw = (location.hash || '').replace(/^#/, '').trim();
      var slug = canonicalSlug(raw);
      var item = slug ? itemForSlug(slug) : null;
      if (!item) {
        if (raw) {
          item = defaultItem();
          slug = item.getAttribute('data-slug');
          history.replaceState(null, '', location.pathname + location.search + '#' + slug);
        } else {
          item = defaultItem();
          applyItem(item, { closeMobile: false });
          return;
        }
      }
      applyItem(item, { closeMobile: !!options.closeMobile });
    }

    function setOpen(open) {
      shell.classList.toggle('sidebar-open', open);
      if (toggle) {
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('title', open ? 'Close menu' : 'Open menu');
      }
    }

    function closeSidebar() {
      setOpen(false);
    }

    function toggleSidebar() {
      setOpen(!shell.classList.contains('sidebar-open'));
    }

    if (toggle) {
      toggle.addEventListener('click', function () {
        if (mq.matches) toggleSidebar();
      });
    }

    if (scrim) {
      scrim.addEventListener('click', closeSidebar);
    }

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mq.matches) closeSidebar();
    });

    function onViewportMqChange() {
      if (!mq.matches) setOpen(false);
    }
    if (typeof mq.addEventListener === 'function') {
      mq.addEventListener('change', function (e) {
        if (!e.matches) setOpen(false);
      });
    } else if (typeof mq.addListener === 'function') {
      mq.addListener(onViewportMqChange);
    }

    window.addEventListener('hashchange', function () {
      syncFromHash({ closeMobile: mq.matches });
    });

    items.forEach(function (item) {
      item.addEventListener('click', function () {
        if (mq.matches) closeSidebar();
      });
    });

    syncFromHash({ closeMobile: false });
  })();
</script>

</body>
</html>
