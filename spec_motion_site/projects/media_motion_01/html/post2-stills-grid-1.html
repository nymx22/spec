<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>post1.2 — still grid 1</title>
  <style>
    :root { --bg: #e6e6e6; --border: rgba(0,0,0,0.14); }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    .grid {
      height: 100%;
      box-sizing: border-box;
      padding: 10px;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }
    .cell { border: 0.5px solid var(--border); border-radius: 10px; overflow: hidden; background: rgba(255,255,255,0.35); }
    iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="grid" aria-label="Still images grid 1">
    <div class="cell"><iframe title="Still 1" src="post2-gallery.html?max=5&lock=1#venn-frame-1"></iframe></div>
    <div class="cell"><iframe title="Still 2" src="post2-gallery.html?max=5&lock=1#venn-frame-2"></iframe></div>
    <div class="cell"><iframe title="Still 3" src="post2-gallery.html?max=5&lock=1&still03=1#venn-frame-3"></iframe></div>
    <div class="cell"><iframe title="Still 4" src="post2-gallery.html?lock=1&overlapStill=1#venn-overlap"></iframe></div>
    <div class="cell"><iframe title="Still 5" src="post2-gallery.html?lock=1&spectrumStill=1#venn-overlap"></iframe></div>
    <div class="cell" aria-hidden="true"></div>
  </div>
</body>
</html>
