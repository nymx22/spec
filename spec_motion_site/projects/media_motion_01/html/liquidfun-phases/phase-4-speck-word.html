<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4 — speck in circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "genwanlatin";
      font-weight: 400;
      font-style: normal;
      src: url("https://freight.cargo.site/m/K2650652186881166999210129014453/genwan_latin_092725_1-r-webfont.woff2") format("woff2");
    }
    :root {
      --bg:     #e6e6e6;
      --ink:    #141414;
      --border: rgba(0,0,0,0.14);
      --muted:  rgba(0,0,0,0.42);
    }
    html { font-size: 18px; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Fills iframe / mobile: toolbar + canvas share viewport */
    .demo-root {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .demo-toolbar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      row-gap: 10px;
      padding: 10px 12px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid var(--border);
    }

    .demo-main {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .demo-main canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      object-position: center;
    }

    .page3-controls {
      position: absolute;
      inset: auto 10px 10px 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .page3-controls.active {
      display: flex;
    }

    .page3-arrow {
      pointer-events: auto;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      color: rgba(20,20,20,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .page3-arrow:hover {
      background: rgba(255,255,255,0.92);
      color: #141414;
    }

    .page3-arrow svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .page3-counter {
      pointer-events: none;
      font-size: 0.82rem;
      color: rgba(0,0,0,0.56);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.68);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .demo-meta {
      flex: 1 1 100%;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    button {
      padding: 6px 14px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
    }
    button:hover { color: var(--ink); border-color: rgba(0,0,0,0.28); }
    button:disabled {
      cursor: default;
      color: var(--muted);
      opacity: 0.72;
    }
    button:disabled:hover {
      color: var(--muted);
      border-color: var(--border);
    }
    label { font-size: 1rem; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
    input#glyphInput {
      width: 120px;
      padding: 4px 8px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      text-align: center;
    }
    input:focus { outline: none; border-color: rgba(0,0,0,0.28); }
    input[type="color"]#glyphColor {
      width: 36px;
      height: 28px;
      padding: 0;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    input[type="color"]#glyphColor::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]#glyphColor::-webkit-color-swatch { border-radius: 4px; border: none; }
    main { display: block; }

    @media (max-width: 520px) {
      html { font-size: 15px; }
      .demo-toolbar { padding: 8px 10px; }
      button { padding: 8px 12px; font-size: 0.88rem; }
      label { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div class="demo-root">
    <div class="demo-toolbar">
      <div class="row">
        <button id="breakBtn" type="button">Break Glyph</button>
        <button id="resetBtn" type="button">Reset</button>
        <label title="Glyph &amp; particle color">Color <input id="glyphColor" type="color" value="#ffffff" /></label>
        <label>Word <input id="glyphInput" type="text" maxlength="12" value="speck" title="Letters only" spellcheck="false" /></label>
      </div>
      <span id="particleInfo" class="demo-meta"></span>
    </div>
    <main class="demo-main"></main>
    <div id="page3Controls" class="page3-controls" aria-label="page 3 views">
      <button id="page3Prev" class="page3-arrow" type="button" aria-label="Previous view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span id="page3Counter" class="page3-counter">2 / 2</span>
      <button id="page3Next" class="page3-arrow" type="button" aria-label="Next view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="../../js/canvasFit4x5.js"></script>
  <script src="../../js/lib/liquidfun.js"></script>
  <script>
    var PAGE3_MODE = (location.hash || '').replace(/^#/, '').trim().toLowerCase() === 'post12-3';
    var VENN_REF = {
      layoutRefW: 600,
      offset: 55,
      radius: 85,
      scale: 1.7,
      labelFracTop: 0.58,
    };
    // Matches sketch.js gallery frame 2 spread geometry.
    var VENN_SPREAD_MULT = 1.35;
    /** Same as sketch frame 1: VENN_R * 2 * VENN_SCALE */
    var VENN_SIZE_SCALED = VENN_REF.radius * 2 * VENN_REF.scale;
    var VENN_LABEL_WORDS = ['speck', 'inspect', 'spectrum'];
    var VENN_LABEL_FIXED_THETAS = [0, null, null];
    var LABEL_MIN_FRAC_TOP = 0.48;
    var LABEL_MAX_FRAC_TOP = 0.68;
    var LABEL_MIN_FRAC_BOTTOM = 0.48;
    var LABEL_MAX_FRAC_BOTTOM = 0.68;
    var LABEL_DIST_STEP = 0.05;
    var LABEL_MARGIN_PX = 2;
    var _page3LayoutLs = 1;
    var _page3LabelLayoutsCache = null;
    var _page3LabelLayoutsKey = '';
    var AUTO_BREAK_DELAY_MS = 220;
    var AUTO_BREAK_MS = 2000;
    var RESET_AFTER_BOTTOM_HIT_MS = 2000;
    var autoBreakAtMs = -1;
    var PAGE3_TOTAL_VIEWS = 2;
    var page3View = 2; // 1=speck only, 2=venn+isolated speck region
    /** Box2D body: edge segments along lower circles (view 2 only). */
    var page3InnerWallBody = null;

    // Phase 4 variant: word “speck” (genwanlatin) inside the circle — same break, stagger, mask trim, fade,
    // and glyph overlay as phase-4-break-one-glyph-no-collision (wider raster + higher patch cap).
    var CFG = {
      gravityY: 32,
      radius: PAGE3_MODE ? 1.8 : 3.2,
      /** Fill disk radius per group (world-only single blob uses ~0.07·min); smaller = more patches, smoother S. */
      groupPatchRadiusFrac: PAGE3_MODE ? 0.003 : 0.028,
      dampingStrength: 0.6,
      viscousStrength: 0.2,
      elasticStrength: 0.01,
      springStrength: 0.01,
      repulsiveStrength: 0.0,
      pressureStrength: 0.014,
      powderStrength: 0.06,
      surfaceTensionNormalStrength: 0.02,
      surfaceTensionPressureStrength: 0.02,
      setDamping: 0.72,
      wallFriction: 0.35,
      wallRestitution: 0.20,
      stepVelIters: 17,
      stepPosIters: 6,
      simSpeed: 5,
      airDrag: 0.005,
      upwardExtraDrag: 0.02,
      /** World units subtracted from wall radius when fitting (patch extent + slack). */
      fitWallInset: 6,
      /** Physics steps after spawn so fluid packs slightly, then mask-trim runs (before break). */
      trimSettleSteps: PAGE3_MODE ? 7 : 5,
      /** DestroyParticlesInShape radius as fraction of particle radius (small = one-at-a-time, keeps groups intact). */
      trimKillRadiusFrac: 0.52,
      /** Draw: particle fill alpha (speed still adds on top within min–max). */
      particleAlphaBase: 118,
      particleAlphaSpeedScale: 36,
      particleAlphaMin: 85,
      particleAlphaMax: 228,
      /** Pre-break glyph: outline alpha (fill stays solid white). */
      silhouetteOutlineAlpha: 255,
      silhouetteFillAlpha: 255,
      /** After Break: particles ramp from invisible to full draw alpha (ms). */
      postBreakFadeInMs: 320,
      /** Before Break: multiply particle alpha by this (0 = invisible under glyph). */
      preBreakParticleOpacity: 0,
      /** Top→bottom cascade: ms from first release (top) to last (bottom). */
      fallStaggerMs: 880,
      /** Per-particle spread so the front isn’t a perfect line (ms ±). */
      fallStaggerJitterMs: 48,
      /** >1 stretches lower rows later (more gradual tail). */
      fallStaggerEase: 1.22,
      /** Optional ms after last particle releases before glyph overlay hits alpha 0 (0 = gone exactly at last release). */
      glyphFadeOutTailMs: 140,
      /** Raster buffer for multi-letter word (genwanlatin). */
      wordMaskWidth: PAGE3_MODE ? 520 : 400,
      wordMaskHeight: PAGE3_MODE ? 220 : 170,
      wordTextSize: 76,
      defaultWord: 'speck',
    };

    var world;
    var particleSystem;
    var phase4 = {
      wallsReady: false,
      cx: 0,
      cy: 0,
      r: 0,
      glyph: 'speck',
      glyphCenterX: 0,
      glyphCenterY: 0,
      glyphPoints: [],
      glyphEmitIndex: 0,
      isBreaking: false,
      /** millis() when break started; used only while isBreaking. */
      breakFadeStartMs: -1,
      groupPatchRadius: 14,
      glyphMaskGfx: null,
      glyphDrawS: 1,
      glyphBboxCx: 0,
      glyphBboxCy: 0,
      /** Uint8Array[gfx.w*gfx.h], 1 = ink (same threshold as sampling). */
      glyphMaskHit: null,
      trimmedParticleCount: 0,
      /** Pinned Box2D coords until fallReleaseAtMs[k]; set at break only. */
      fallPinPx: null,
      fallPinPy: null,
      fallReleaseAtMs: null,
      /** max(fallReleaseAtMs); glyph overlay fully faded by this + tail. */
      fallLastReleaseMs: -1,
      /** millis() when the current scene got ready (for page-3 auto cycle). */
      sceneReadyAtMs: -1,
      /** page-3: first time a released particle reaches bottom arc. */
      firstBottomHitMs: -1,
      /** page-3: fallback if bottom hit never triggers due simulation variance. */
      breakStartMs: -1,
      /** From #glyphColor — fill tint & particles (synced in wireUI). */
      glyphRgb: PAGE3_MODE ? { r: 0, g: 0, b: 0 } : { r: 255, g: 255, b: 255 },
    };

    /** Max CreateParticleGroup calls (each patch relaxes like world-only disk). */
    var MAX_PATCH_GROUPS = PAGE3_MODE ? 900 : 520;

    /** Spec title font (same as index / media_motion_01 .brand / .project-title). Loaded via @font-face above. */
    var SPEC_TITLE_FONT = 'genwanlatin';
    /** True after first glyph build once genwanlatin is actually active (avoids wrong mask on slow font load). */
    var specFontGlyphPrimed = false;

    function applySpecTitleFont(g) {
      if (g) g.textFont(SPEC_TITLE_FONT);
      else textFont(SPEC_TITLE_FONT);
    }

    function specFontReady() {
      if (!document.fonts) return true;
      try {
        return document.fonts.check('400 ' + CFG.wordTextSize + 'px ' + SPEC_TITLE_FONT);
      } catch (e) {
        return true;
      }
    }

    function hexToRgb(hex) {
      var h = (hex || '').replace(/^#/, '');
      if (h.length === 3) {
        h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      }
      if (h.length !== 6) return { r: 255, g: 255, b: 255 };
      var n = parseInt(h, 16);
      if (isNaN(n)) return { r: 255, g: 255, b: 255 };
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function syncGlyphColorFromUI() {
      if (PAGE3_MODE) {
        phase4.glyphRgb = { r: 0, g: 0, b: 0 };
        return;
      }
      var el = document.getElementById('glyphColor');
      phase4.glyphRgb = hexToRgb(el && el.value ? el.value : '#ffffff');
    }

    function getVennSpeckCenter() {
      var ls = width / VENN_REF.layoutRefW;
      var cy = height / 2;
      var cx = width / 2;
      var off = VENN_REF.offset * ls;
      return { cx: cx, cy: cy - off, ls: ls };
    }

    function getVennTargets() {
      var ls = width / VENN_REF.layoutRefW;
      var cy = height / 2;
      var cx = width / 2;
      var off = VENN_REF.offset * ls;
      if (PAGE3_MODE) off *= VENN_SPREAD_MULT;
      return [
        { x: cx, y: cy - off },              // top (speck)
        { x: cx - off * 0.9, y: cy + off * 0.6 }, // left
        { x: cx + off * 0.9, y: cy + off * 0.6 }, // right
      ];
    }

    function pointInIsolatedSpeckRegion(px, py, targets, r) {
      // Borders are included:
      // - inside (or on) top circle
      // - outside (or on) both lower circles
      var t = targets[0];
      var l = targets[1];
      var rr = targets[2];
      var r2 = r * r;
      var dt = (px - t.x) * (px - t.x) + (py - t.y) * (py - t.y);
      if (dt > r2) return false;
      var dl = (px - l.x) * (px - l.x) + (py - l.y) * (py - l.y);
      if (dl < r2) return false;
      var dr = (px - rr.x) * (px - rr.x) + (py - rr.y) * (py - rr.y);
      if (dr < r2) return false;
      return true;
    }

    function page3ShortestAngleDelta(a1, a2) {
      var d = a2 - a1;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    // Equal-radius circle–circle intersections (two points).
    function page3CircleCircleIntersectionsEqualR(cx0, cy0, cx1, cy1, r) {
      var dx = cx1 - cx0;
      var dy = cy1 - cy0;
      var d = Math.hypot(dx, dy);
      if (d < 1e-5 || d > 2 * r + 1e-3) return null;
      var a = d / 2;
      var h = Math.sqrt(Math.max(0, r * r - a * a));
      var mx = cx0 + (dx * a) / d;
      var my = cy0 + (dy * a) / d;
      var rx = (-dy / d) * h;
      var ry = (dx / d) * h;
      return [
        { x: mx + rx, y: my + ry },
        { x: mx - rx, y: my - ry },
      ];
    }

    function page3ArcMidGoodLeft(px, py, T, Rr, r) {
      var dT = Math.hypot(px - T.x, py - T.y);
      var dR = Math.hypot(px - Rr.x, py - Rr.y);
      return dT <= r - 0.5 && dR >= r - 0.5;
    }

    function page3ArcMidGoodRight(px, py, T, L, r) {
      var dT = Math.hypot(px - T.x, py - T.y);
      var dL = Math.hypot(px - L.x, py - L.y);
      return dT <= r - 0.5 && dL >= r - 0.5;
    }

    function page3PickLowerArc(cx, cy, r, p1, p2, isLeft, T, L, Rr, rr) {
      var a1 = Math.atan2(p1.y - cy, p1.x - cx);
      var a2 = Math.atan2(p2.y - cy, p2.x - cx);
      var dShort = page3ShortestAngleDelta(a1, a2);
      var midS = a1 + dShort * 0.5;
      var sx = cx + Math.cos(midS) * r;
      var sy = cy + Math.sin(midS) * r;
      var goodS = isLeft
        ? page3ArcMidGoodLeft(sx, sy, T, Rr, rr)
        : page3ArcMidGoodRight(sx, sy, T, L, rr);
      if (goodS) return { ang0: a1, ang1: a1 + dShort };
      var dLong = dShort > 0 ? dShort - 2 * Math.PI : dShort + 2 * Math.PI;
      var midL = a1 + dLong * 0.5;
      var lx = cx + Math.cos(midL) * r;
      var ly = cy + Math.sin(midL) * r;
      var goodL = isLeft
        ? page3ArcMidGoodLeft(lx, ly, T, Rr, rr)
        : page3ArcMidGoodRight(lx, ly, T, L, rr);
      if (goodL) return { ang0: a1, ang1: a1 + dLong };
      return { ang0: a1, ang1: a1 + dShort };
    }

    function page3AddArcEdgesToBody(body, LF, cx, cy, r, ang0, ang1, segs) {
      var dAng = page3ShortestAngleDelta(ang0, ang1);
      var n = Math.max(10, segs | 0);
      for (var i = 0; i < n; i++) {
        var t0 = i / n;
        var t1 = (i + 1) / n;
        var aa0 = ang0 + dAng * t0;
        var aa1 = ang0 + dAng * t1;
        var x0 = cx + Math.cos(aa0) * r;
        var y0 = cy + Math.sin(aa0) * r;
        var x1 = cx + Math.cos(aa1) * r;
        var y1 = cy + Math.sin(aa1) * r;
        var edge = new LF.b2EdgeShape();
        edge.Set(new LF.b2Vec2(x0, -y0), new LF.b2Vec2(x1, -y1));
        var fd = new LF.b2FixtureDef();
        fd.shape = edge;
        fd.friction = CFG.wallFriction;
        fd.restitution = CFG.wallRestitution;
        fd.density = 0;
        body.CreateFixtureFromDef(fd);
      }
    }

    function page3CreateInnerWallBody() {
      var LF = window.liquidfun;
      var targets = getVennTargets();
      var T = targets[0];
      var L = targets[1];
      var Rr = targets[2];
      var r = phase4.r;
      var ipTL = page3CircleCircleIntersectionsEqualR(T.x, T.y, L.x, L.y, r);
      var ipTR = page3CircleCircleIntersectionsEqualR(T.x, T.y, Rr.x, Rr.y, r);
      if (!ipTL || !ipTR) return null;
      var arcL = page3PickLowerArc(L.x, L.y, r, ipTL[0], ipTL[1], true, T, L, Rr, r);
      var arcR = page3PickLowerArc(Rr.x, Rr.y, r, ipTR[0], ipTR[1], false, T, L, Rr, r);
      var bd = new LF.b2BodyDef();
      bd.position = new LF.b2Vec2(0, 0);
      var body = world.CreateBody(bd);
      page3AddArcEdgesToBody(body, LF, L.x, L.y, r, arcL.ang0, arcL.ang1, 32);
      page3AddArcEdgesToBody(body, LF, Rr.x, Rr.y, r, arcR.ang0, arcR.ang1, 32);
      return body;
    }

    function syncPage3InnerWalls() {
      if (!PAGE3_MODE || !world) return;
      if (page3InnerWallBody) {
        world.DestroyBody(page3InnerWallBody);
        page3InnerWallBody = null;
      }
      if (page3View !== 2) return;
      page3InnerWallBody = page3CreateInnerWallBody();
    }

    function page3DistSq(ax, ay, bx, by) {
      var dx = ax - bx;
      var dy = ay - by;
      return dx * dx + dy * dy;
    }

    function page3PointInsideCircle(px, py, c, r) {
      var m = LABEL_MARGIN_PX * _page3LayoutLs;
      return page3DistSq(px, py, c.x, c.y) < (r - m) * (r - m);
    }

    function page3PointOutsideCircle(px, py, c, r) {
      var m = LABEL_MARGIN_PX * _page3LayoutLs;
      return page3DistSq(px, py, c.x, c.y) > (r + m) * (r + m);
    }

    function page3IsExclusivePoint(px, py, i, centers, r) {
      if (!page3PointInsideCircle(px, py, centers[i], r)) return false;
      for (var k = 0; k < centers.length; k++) {
        if (k === i) continue;
        if (!page3PointOutsideCircle(px, py, centers[k], r)) return false;
      }
      return true;
    }

    function page3RotatedRectFits(px, py, theta, w, h, i, centers, r) {
      var hw = w / 2;
      var hh = h / 2;
      var c = Math.cos(theta);
      var s = Math.sin(theta);
      var pts = [
        { x: -hw, y: -hh },
        { x: hw, y: -hh },
        { x: hw, y: hh },
        { x: -hw, y: hh },
        { x: 0, y: -hh },
        { x: 0, y: hh },
        { x: -hw, y: 0 },
        { x: hw, y: 0 },
      ];
      for (var pi = 0; pi < pts.length; pi++) {
        var p = pts[pi];
        var rx = px + p.x * c - p.y * s;
        var ry = py + p.x * s + p.y * c;
        if (!page3IsExclusivePoint(rx, ry, i, centers, r)) return false;
      }
      return true;
    }

    function page3NormalizeAnglePi(a) {
      var x = a;
      while (x > Math.PI) x -= Math.PI * 2;
      while (x < -Math.PI) x += Math.PI * 2;
      return x;
    }

    function page3MakeTextUpright(theta) {
      var t = page3NormalizeAnglePi(theta);
      if (t > Math.PI / 2) t -= Math.PI;
      if (t < -Math.PI / 2) t += Math.PI;
      return t;
    }

    function page3ComputeExclusiveLabelLayout(centers, r, words, textPx) {
      textSize(textPx);
      var h = textAscent() + textDescent();
      var layouts = [];
      for (var ii = 0; ii < 3; ii++) {
        var ci = centers[ii];
        var dx = 0;
        var dy = 0;
        for (var oi = 0; oi < centers.length; oi++) {
          if (oi === ii) continue;
          var oc = centers[oi];
          var vx = ci.x - oc.x;
          var vy = ci.y - oc.y;
          var mm = Math.hypot(vx, vy) || 1;
          dx += vx / mm;
          dy += vy / mm;
        }
        var dm = Math.hypot(dx, dy) || 1;
        dx /= dm;
        dy /= dm;
        var baseTheta = Math.atan2(dy, dx);
        var w = textWidth(words[ii]);
        var best = null;
        var fixed = page3ComputeExclusiveLabelLayout.fixedThetas
          ? page3ComputeExclusiveLabelLayout.fixedThetas[ii]
          : null;
        var thetaCandidates =
          typeof fixed === 'number'
            ? [fixed]
            : [
                page3MakeTextUpright(baseTheta + Math.PI / 2),
                page3MakeTextUpright(baseTheta - Math.PI / 2),
              ];
        var minFrac = ii === 0 ? LABEL_MIN_FRAC_TOP : LABEL_MIN_FRAC_BOTTOM;
        var maxFrac = ii === 0 ? LABEL_MAX_FRAC_TOP : LABEL_MAX_FRAC_BOTTOM;
        for (var frac = maxFrac; frac >= minFrac; frac -= LABEL_DIST_STEP) {
          var px = ci.x + dx * (frac * r);
          var py = ci.y + dy * (frac * r);
          if (!page3IsExclusivePoint(px, py, ii, centers, r)) continue;
          for (var ti = 0; ti < thetaCandidates.length; ti++) {
            var th = thetaCandidates[ti];
            if (page3RotatedRectFits(px, py, th, w, h, ii, centers, r)) {
              best = { dx: px - ci.x, dy: py - ci.y, theta: th };
              break;
            }
          }
          if (best) break;
        }
        if (!best) {
          for (var frac2 = maxFrac; frac2 >= minFrac; frac2 -= LABEL_DIST_STEP) {
            var px2 = ci.x + dx * (frac2 * r);
            var py2 = ci.y + dy * (frac2 * r);
            if (page3IsExclusivePoint(px2, py2, ii, centers, r)) {
              var th2 =
                typeof fixed === 'number' ? fixed : page3MakeTextUpright(baseTheta + Math.PI / 2);
              best = { dx: px2 - ci.x, dy: py2 - ci.y, theta: th2 };
              break;
            }
          }
        }
        layouts.push(best || { dx: 0, dy: 0, theta: 0 });
      }
      return layouts;
    }

    function page3EnsureSpeckLabelLayouts() {
      var ls = width / VENN_REF.layoutRefW;
      var targets = getVennTargets();
      var vennD = VENN_SIZE_SCALED * ls;
      var rFinal = vennD / 2;
      var vennTextPx = 24 * ls;
      var key =
        rFinal +
        '|' +
        vennTextPx +
        '|' +
        targets[0].x +
        ',' +
        targets[0].y +
        '|' +
        targets[1].x +
        ',' +
        targets[1].y +
        '|' +
        targets[2].x +
        ',' +
        targets[2].y;
      if (_page3LabelLayoutsKey !== key) {
        _page3LabelLayoutsKey = key;
        _page3LayoutLs = ls;
        applySpecTitleFont();
        page3ComputeExclusiveLabelLayout.fixedThetas = VENN_LABEL_FIXED_THETAS;
        _page3LabelLayoutsCache = page3ComputeExclusiveLabelLayout(
          targets,
          rFinal,
          VENN_LABEL_WORDS,
          vennTextPx
        );
      }
      return { targets: targets, layouts: _page3LabelLayoutsCache };
    }

    /** World position of “speck” label — same as gallery frame 1 (`VENN_LABEL_WORDS[0]`). */
    function getPage3SpeckLabelWorldPos() {
      var o = page3EnsureSpeckLabelLayouts();
      var t = o.targets[0];
      var L = o.layouts[0];
      return { x: t.x + L.dx, y: t.y + L.dy };
    }

    function setPage3View(v) {
      var n = ((v - 1 + PAGE3_TOTAL_VIEWS) % PAGE3_TOTAL_VIEWS) + 1;
      var prev = page3View;
      page3View = n;
      var c = document.getElementById('page3Counter');
      if (c) c.textContent = n + ' / ' + PAGE3_TOTAL_VIEWS;
      if (PAGE3_MODE && prev !== page3View) syncPage3InnerWalls();
    }

    function getGlyphAnchorY() {
      return phase4.cy - phase4.r * 0.34;
    }

    function setup() {
      var dim = window.specCanvas4x5 ? specCanvas4x5.compute() : { w: 480, h: 600 };
      var cnv = createCanvas(dim.w, dim.h);
      if (window.specCanvas4x5) specCanvas4x5.applyPixelDensity(window);
      var mainEl = document.querySelector('main');
      if (mainEl && cnv && cnv.parent) cnv.parent(mainEl);
      initWorld();
      wireUI();
      applySpecTitleFont();
      if (specFontReady()) {
        prepareGlyph(getGlyph());
        specFontGlyphPrimed = true;
      }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('400 ' + CFG.wordTextSize + 'px ' + SPEC_TITLE_FONT).catch(function () {});
      }
      if (PAGE3_MODE) {
        var toolbar = document.querySelector('.demo-toolbar');
        if (toolbar) toolbar.style.display = 'none';
        var controls = document.getElementById('page3Controls');
        if (controls) controls.style.display = 'none';
        setPage3View(2);
      }
      if (window.specCanvas4x5 && specCanvas4x5.installMainResizeDispatch) specCanvas4x5.installMainResizeDispatch();
    }

    function windowResized() {
      if (!window.specCanvas4x5) return;
      var dim = specCanvas4x5.compute();
      resizeCanvas(dim.w, dim.h);
      specCanvas4x5.applyPixelDensity(window);
      if (PAGE3_MODE) {
        _page3LabelLayoutsKey = '';
        _page3LabelLayoutsCache = null;
      }
      resetScene();
    }

    function createParticleSystemDef(LF) {
      var psd = new LF.b2ParticleSystemDef();
      psd.radius = CFG.radius;
      psd.dampingStrength = CFG.dampingStrength;
      psd.viscousStrength = CFG.viscousStrength;
      psd.elasticStrength = CFG.elasticStrength;
      psd.springStrength = CFG.springStrength;
      psd.repulsiveStrength = CFG.repulsiveStrength;
      psd.pressureStrength = CFG.pressureStrength;
      psd.powderStrength = CFG.powderStrength;
      psd.surfaceTensionNormalStrength = CFG.surfaceTensionNormalStrength;
      psd.surfaceTensionPressureStrength = CFG.surfaceTensionPressureStrength;
      return psd;
    }

    function initWorld() {
      var LF = window.liquidfun;
      page3InnerWallBody = null;
      // Start with no gravity so pre-spawned particles stay under silhouette until "Break Glyph".
      world = new LF.b2World(new LF.b2Vec2(0, 0));
      particleSystem = world.CreateParticleSystem(createParticleSystemDef(LF));
      particleSystem.SetDamping(CFG.setDamping);
      particleSystem.SetRadius(CFG.radius);

      if (PAGE3_MODE) {
        var speck = getVennSpeckCenter();
        phase4.cx = speck.cx;
        phase4.cy = speck.cy;
        // Match Venn frame-1 speck circle radius exactly: VENN_R * VENN_SCALE * (width / 600).
        phase4.r = VENN_REF.radius * VENN_REF.scale * speck.ls;
      } else {
        phase4.cx = width / 2;
        phase4.cy = height / 2;
        phase4.r = Math.min(width, height) * 0.38;
      }
      addCircleWall(phase4.cx, phase4.cy, phase4.r);
      phase4.groupPatchRadius = Math.min(width, height) * CFG.groupPatchRadiusFrac;
      phase4.wallsReady = true;
      if (PAGE3_MODE) syncPage3InnerWalls();
    }

    function addCircleWall(cx, cy, r) {
      var LF = window.liquidfun;
      var chain = new LF.b2ChainShape();
      var segs = 56;
      for (var i = 0; i < segs; i++) {
        var a = (i / segs) * Math.PI * 2;
        var x = cx + Math.cos(a) * r;
        var y = cy + Math.sin(a) * r;
        chain.vertices.push(new LF.b2Vec2(x, -y));
      }
      chain.CreateLoop();
      var bd = new LF.b2BodyDef();
      bd.position = new LF.b2Vec2(0, 0);
      var body = world.CreateBody(bd);
      var fd = new LF.b2FixtureDef();
      fd.shape = chain;
      fd.friction = CFG.wallFriction;
      fd.restitution = CFG.wallRestitution;
      fd.density = 0;
      window.world = world;
      body.CreateFixtureFromDef(fd);
    }

    function getGlyph() {
      var raw = (document.getElementById('glyphInput').value || CFG.defaultWord).trim();
      var v = raw.replace(/[^A-Za-z]/g, '');
      if (!v.length) return CFG.defaultWord;
      return v.length > 12 ? v.slice(0, 12) : v;
    }

    function scanGlyphBBox(g, threshold) {
      var minX = g.width;
      var maxX = -1;
      var minY = g.height;
      var maxY = -1;
      for (var y = 0; y < g.height; y++) {
        for (var x = 0; x < g.width; x++) {
          var idx = (y * g.width + x) * 4 + 3;
          if (g.pixels[idx] < threshold) continue;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
      if (maxX < 0) return null;
      return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
    }

    /** Max distance from wall center to any bbox corner after scaling ink from pixel anchor (cx_pix,cy_pix) to world (gx,gy). */
    function maxCornerDistFromWall(gx, gy, cx_pix, cy_pix, bbox, s, WCx, WCy) {
      var c = [
        [bbox.minX, bbox.minY],
        [bbox.maxX, bbox.minY],
        [bbox.minX, bbox.maxY],
        [bbox.maxX, bbox.maxY],
      ];
      var m = 0;
      for (var i = 0; i < 4; i++) {
        var wx = gx + (c[i][0] - cx_pix) * s;
        var wy = gy + (c[i][1] - cy_pix) * s;
        var d = Math.hypot(wx - WCx, wy - WCy);
        if (d > m) m = d;
      }
      return m;
    }

    /** Largest uniform scale s so all corners stay inside wall circle (radius innerR). */
    function computeFitScale(gx, gy, WCx, WCy, innerR, cx_pix, cy_pix, bbox) {
      if (innerR <= 1 || !bbox) return 0.25;
      function maxD(s) {
        return maxCornerDistFromWall(gx, gy, cx_pix, cy_pix, bbox, s, WCx, WCy);
      }
      if (maxD(0) > innerR) return 0.08;
      var lo = 0;
      var hi = 0.25;
      for (var k = 0; k < 14; k++) {
        if (maxD(hi) > innerR) break;
        lo = hi;
        hi *= 1.35;
        if (hi > 80) break;
      }
      if (maxD(hi) <= innerR) return hi;
      for (var iter = 0; iter < 36; iter++) {
        var mid = (lo + hi) * 0.5;
        if (maxD(mid) <= innerR) lo = mid;
        else hi = mid;
      }
      return lo;
    }

    function cacheGlyphMaskHit(gfx, threshold) {
      var w = gfx.width;
      var h = gfx.height;
      var hit = new Uint8Array(w * h);
      gfx.loadPixels();
      for (var yy = 0; yy < h; yy++) {
        for (var xx = 0; xx < w; xx++) {
          var a = gfx.pixels[(yy * w + xx) * 4 + 3];
          hit[yy * w + xx] = a >= threshold ? 1 : 0;
        }
      }
      phase4.glyphMaskHit = hit;
    }

    /** p5 coords: x right, y down; matches draw() mapping from Box2D (y flip). */
    function worldP5PointInsideGlyph(pxP5, pyP5) {
      var g = phase4.glyphMaskGfx;
      var hit = phase4.glyphMaskHit;
      if (!g || !hit || !hit.length) return false;
      var s = phase4.glyphDrawS;
      if (s < 1e-9) return false;
      var gx = phase4.glyphCenterX;
      var gy = phase4.glyphCenterY;
      var cxp = phase4.glyphBboxCx;
      var cyp = phase4.glyphBboxCy;
      var px = (pxP5 - gx) / s + cxp;
      var py = (pyP5 - gy) / s + cyp;
      var ix = Math.floor(px);
      var iy = Math.floor(py);
      if (ix < 0 || iy < 0 || ix >= g.width || iy >= g.height) return false;
      return hit[iy * g.width + ix] !== 0;
    }

    /**
     * Remove particles whose centers map outside the glyph mask (after brief settle).
     * Uses DestroyParticlesInShape (tiny disk) so original CreateParticleGroup membership
     * and fluid cohesion stay intact — unlike DestroyParticleSystem + CreateParticle.
     */
    function trimParticlesToGlyphMask() {
      if (!world || !particleSystem) return;
      var LF = window.liquidfun;
      var xf = new LF.b2Transform();
      xf.SetIdentity();
      var pr = particleSystem.radius;
      var killR = Math.max(pr * CFG.trimKillRadiusFrac, 1e-4);
      var maxIter = 250000;
      var iter = 0;
      while (iter++ < maxIter) {
        var pos = particleSystem.GetPositionBuffer();
        if (!pos || pos.length < 2) break;
        var bx = null;
        var by = null;
        for (var i = 0; i < pos.length; i += 2) {
          var px = pos[i];
          var py = pos[i + 1];
          if (!worldP5PointInsideGlyph(px, -py)) {
            bx = px;
            by = py;
            break;
          }
        }
        if (bx === null) break;
        var circle = new LF.b2CircleShape();
        circle.position.Set(bx, by);
        circle.radius = killR;
        var removed = particleSystem.DestroyParticlesInShape(circle, xf);
        if (!removed) {
          circle.radius = killR * 1.35;
          removed = particleSystem.DestroyParticlesInShape(circle, xf);
        }
        if (!removed) break;
      }
      var posFinal = particleSystem.GetPositionBuffer();
      phase4.trimmedParticleCount = posFinal ? posFinal.length >> 1 : 0;
    }

    function buildGlyphPoints(ch) {
      if (!phase4.wallsReady) return;
      if (phase4.glyphMaskGfx) {
        phase4.glyphMaskGfx.remove();
        phase4.glyphMaskGfx = null;
      }

      var g = createGraphics(CFG.wordMaskWidth, CFG.wordMaskHeight);
      g.pixelDensity(1);
      g.clear();
      g.noStroke();
      g.fill(255);
      g.textAlign(CENTER, CENTER);
      applySpecTitleFont(g);
      g.textSize(CFG.wordTextSize);
      g.textStyle(NORMAL);
      g.text(ch, g.width / 2, g.height / 2 + 6);
      g.loadPixels();

      var centerX = phase4.glyphCenterX;
      var centerY = phase4.glyphCenterY;
      var step = 1;
      var threshold = 140;
      var bbox = scanGlyphBBox(g, threshold);
      var cx_pix = g.width / 2;
      var cy_pix = g.height / 2;
      if (!bbox) {
        phase4.glyphMaskGfx = g;
        phase4.glyphDrawS = 1;
        phase4.glyphBboxCx = cx_pix;
        phase4.glyphBboxCy = cy_pix;
        phase4.glyphMaskHit = null;
        return [];
      }
      cx_pix = (bbox.minX + bbox.maxX) * 0.5;
      cy_pix = (bbox.minY + bbox.maxY) * 0.5;

      var patchR = phase4.groupPatchRadius || Math.min(width, height) * CFG.groupPatchRadiusFrac;
      var innerR = Math.max(phase4.r - patchR - CFG.fitWallInset, phase4.r * 0.25);
      var s = computeFitScale(centerX, centerY, phase4.cx, phase4.cy, innerR, cx_pix, cy_pix, bbox);
      if (PAGE3_MODE) {
        // Match Venn frame-1 label scale: VENN_TEXT_SIZE(24) * (width / 600).
        var vennLs = width / VENN_REF.layoutRefW;
        var targetTextPx = 24 * vennLs;
        var targetS = targetTextPx / Math.max(1, CFG.wordTextSize);
        s = Math.min(s, targetS);
      }

      phase4.glyphMaskGfx = g;
      phase4.glyphDrawS = s;
      phase4.glyphBboxCx = cx_pix;
      phase4.glyphBboxCy = cy_pix;
      cacheGlyphMaskHit(g, threshold);

      var pts = [];
      for (var y = 0; y < g.height; y += step) {
        for (var x = 0; x < g.width; x += step) {
          var idx = (y * g.width + x) * 4 + 3;
          if (g.pixels[idx] < threshold) continue;
          var wx = centerX + (x - cx_pix) * s;
          var wy = centerY + (y - cy_pix) * s;
          pts.push({ x: wx, y: wy });
        }
      }
      shuffleArray(pts);
      var minSep = patchR * 2.02;
      var minSep2 = minSep * minSep;
      var spaced = [];
      for (var pi = 0; pi < pts.length; pi++) {
        var q = pts[pi];
        var ok = true;
        for (var sj = 0; sj < spaced.length; sj++) {
          var ddx = q.x - spaced[sj].x;
          var ddy = q.y - spaced[sj].y;
          if (ddx * ddx + ddy * ddy < minSep2) {
            ok = false;
            break;
          }
        }
        if (ok) spaced.push(q);
      }
      pts = spaced;
      if (pts.length > MAX_PATCH_GROUPS) {
        shuffleArray(pts);
        pts.length = MAX_PATCH_GROUPS;
      }
      return pts;
    }

    function shuffleArray(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0;
        var t = arr[i];
        arr[i] = arr[j];
        arr[j] = t;
      }
    }

    function prepareGlyph(ch) {
      phase4.glyph = ch;
      if (PAGE3_MODE) {
        var p = getPage3SpeckLabelWorldPos();
        phase4.glyphCenterX = p.x;
        phase4.glyphCenterY = p.y;
      } else {
        phase4.glyphCenterX = phase4.cx;
        phase4.glyphCenterY = getGlyphAnchorY();
      }
      phase4.glyphPoints = buildGlyphPoints(ch) || [];
      shuffleArray(phase4.glyphPoints);
      phase4.glyphEmitIndex = phase4.glyphPoints.length;
      phase4.isBreaking = false;
      phase4.breakFadeStartMs = -1;
      phase4.fallPinPx = null;
      phase4.fallPinPy = null;
      phase4.fallReleaseAtMs = null;
      phase4.fallLastReleaseMs = -1;
      phase4.sceneReadyAtMs = millis();
      phase4.firstBottomHitMs = -1;
      spawnGlyphParticleGroups();
      var ts = CFG.trimSettleSteps | 0;
      for (var st = 0; st < ts; st++) {
        world.Step(1 / 60, CFG.stepVelIters, CFG.stepPosIters);
      }
      trimParticlesToGlyphMask();
      var el = document.getElementById('particleInfo');
      if (el) {
        var pr = phase4.groupPatchRadius.toFixed(1);
        el.textContent =
          phase4.glyphPoints.length +
          ' patches · ' +
          phase4.trimmedParticleCount +
          ' particles (mask-trimmed) · r=' +
          pr +
          ' · fit s=' +
          phase4.glyphDrawS.toFixed(3) +
          ' · cap ' +
          MAX_PATCH_GROUPS;
      }
      syncBreakButtonState();
    }

    function syncBreakButtonState() {
      var btn = document.getElementById('breakBtn');
      if (!btn) return;
      if (phase4.isBreaking) {
        btn.disabled = true;
        btn.textContent = 'Reset first';
      } else {
        btn.disabled = false;
        btn.textContent = 'Break Glyph';
      }
    }

    function startGlyphDisintegration(ch) {
      if (ch !== phase4.glyph) prepareGlyph(ch);
      phase4.isBreaking = true;
      phase4.breakFadeStartMs = millis();
      phase4.breakStartMs = phase4.breakFadeStartMs;
      releasePreSpawnedParticles();
      syncBreakButtonState();
    }

    function spawnGlyphParticleGroups() {
      if (!particleSystem) return;
      var LF = window.liquidfun;
      var patchR = phase4.groupPatchRadius;
      for (var i = 0; i < phase4.glyphPoints.length; i++) {
        var p = phase4.glyphPoints[i];
        var circle = new LF.b2CircleShape();
        circle.position.Set(p.x, -p.y);
        circle.radius = patchR;
        var pgd = new LF.b2ParticleGroupDef();
        pgd.shape = circle;
        pgd.flags = LF.b2_waterParticle;
        var c = phase4.glyphRgb;
        pgd.color = new LF.b2ParticleColor(c.r, c.g, c.b, 255);
        particleSystem.CreateParticleGroup(pgd);
      }
    }

    function releasePreSpawnedParticles() {
      if (!world || !particleSystem) return;
      world.SetGravity(new window.liquidfun.b2Vec2(0, -CFG.gravityY));
      particleSystem.SetDamping(0.26);
      var pos = particleSystem.GetPositionBuffer();
      var vel = particleSystem.GetVelocityBuffer();
      if (!vel || vel.length < 2 || !pos || pos.length < 2) return;
      for (var i = 0; i < vel.length; i += 2) {
        vel[i] = 0;
        vel[i + 1] = 0;
      }
      var n = pos.length >> 1;
      var minSy = 1e9;
      var maxSy = -1e9;
      var k;
      for (k = 0; k < n; k++) {
        var sy = -pos[k * 2 + 1];
        if (sy < minSy) minSy = sy;
        if (sy > maxSy) maxSy = sy;
      }
      var span = maxSy - minSy;
      var px = new Float32Array(n);
      var py = new Float32Array(n);
      var rel = new Array(n);
      var t0 = phase4.breakFadeStartMs;
      var St = Math.max(1, CFG.fallStaggerMs);
      var jit = Math.max(0, CFG.fallStaggerJitterMs);
      var ease = Math.max(0.35, CFG.fallStaggerEase);
      for (k = 0; k < n; k++) {
        var ii = k * 2;
        px[k] = pos[ii];
        py[k] = pos[ii + 1];
        var sy2 = -pos[ii + 1];
        var u = span < 1e-6 ? random(0, 1) : (sy2 - minSy) / span;
        u = Math.pow(u, ease);
        var ms = t0 + u * St + random(-jit, jit);
        if (ms < t0) ms = t0;
        rel[k] = ms;
      }
      var tMax = t0;
      for (k = 0; k < n; k++) {
        if (rel[k] > tMax) tMax = rel[k];
      }
      phase4.fallPinPx = px;
      phase4.fallPinPy = py;
      phase4.fallReleaseAtMs = rel;
      phase4.fallLastReleaseMs = tMax;
    }

    function drawGlyphSilhouetteImage(outlineAlpha, fillAlpha, extraDyOpt) {
      if (!phase4.glyphMaskGfx) return;
      if (outlineAlpha <= 0 && fillAlpha <= 0) return;
      var yOff = extraDyOpt != null ? extraDyOpt : 0;
      var s = phase4.glyphDrawS;
      var gx = phase4.glyphCenterX;
      var gy = phase4.glyphCenterY;
      var cxp = phase4.glyphBboxCx;
      var cyp = phase4.glyphBboxCy;
      var img = phase4.glyphMaskGfx;
      var dx = gx - cxp * s;
      var dy = gy - cyp * s + yOff;
      var dw = img.width * s;
      var dh = img.height * s;
      var o = Math.max(1, s * 0.12);
      var outline = [
        [-o, 0],
        [o, 0],
        [0, -o],
        [0, o],
        [-o, -o],
        [-o, o],
        [o, -o],
        [o, o],
      ];
      var cr = phase4.glyphRgb.r;
      var cg = phase4.glyphRgb.g;
      var cb = phase4.glyphRgb.b;
      push();
      noStroke();
      if (outlineAlpha > 0) {
        var or = Math.round(cr * 0.35);
        var og = Math.round(cg * 0.35);
        var ob = Math.round(cb * 0.35);
        tint(or, og, ob, constrain(outlineAlpha, 0, 255));
        for (var oi = 0; oi < outline.length; oi++) {
          image(img, dx + outline[oi][0], dy + outline[oi][1], dw, dh);
        }
      }
      if (fillAlpha > 0) {
        tint(cr, cg, cb, constrain(fillAlpha, 0, 255));
        image(img, dx, dy, dw, dh);
      }
      noTint();
      pop();
    }

    /**
     * Vertical offset = screen-space center of mass of *released* particles minus their pin snapshot.
     * Matches bulk motion/speed of the moving fluid (not max particle, not full-cloud mean while most are pinned).
     */
    function computeGlyphFollowDy(now) {
      if (!phase4.fallPinPy || !particleSystem || !phase4.fallReleaseAtMs) return 0;
      var pos = particleSystem.GetPositionBuffer();
      var nPin = phase4.fallPinPy.length;
      if (!pos || pos.length < 2 || !phase4.fallPinPx) return 0;
      var n = Math.min(nPin, pos.length >> 1);
      if (n < 1) return 0;
      var sum = 0;
      var sum0 = 0;
      var cnt = 0;
      for (var k = 0; k < n; k++) {
        // page3 draws particles fully opaque, including pinned ones; follow the same full cloud
        // so the silhouette and particle mass appear to fall at the same speed.
        if (!PAGE3_MODE && now < phase4.fallReleaseAtMs[k]) continue;
        var sy = -pos[k * 2 + 1];
        var sy0 = -phase4.fallPinPy[k];
        sum += sy;
        sum0 += sy0;
        cnt++;
      }
      if (cnt < 1) return 0;
      return (sum - sum0) / cnt;
    }

    function applyFallStaggerPins() {
      if (!phase4.isBreaking || !phase4.fallPinPx || !particleSystem) return;
      var now = millis();
      var pos = particleSystem.GetPositionBuffer();
      var vbuf = particleSystem.GetVelocityBuffer();
      var n = phase4.fallPinPx.length;
      if (!pos || !vbuf || pos.length < n * 2) return;
      for (var k = 0; k < n; k++) {
        if (now >= phase4.fallReleaseAtMs[k]) continue;
        var i = k * 2;
        pos[i] = phase4.fallPinPx[k];
        pos[i + 1] = phase4.fallPinPy[k];
        vbuf[i] = 0;
        vbuf[i + 1] = 0;
      }
    }

    function resetScene() {
      initWorld();
      applySpecTitleFont();
      prepareGlyph(getGlyph());
      specFontGlyphPrimed = true;
    }

    function wireUI() {
      syncGlyphColorFromUI();
      if (PAGE3_MODE) {
        return;
      }
      var colorIn = document.getElementById('glyphColor');
      if (colorIn) {
        colorIn.addEventListener('input', syncGlyphColorFromUI);
        colorIn.addEventListener('change', syncGlyphColorFromUI);
      }
      document.getElementById('breakBtn').addEventListener('click', function () {
        startGlyphDisintegration(getGlyph());
      });
      document.getElementById('resetBtn').addEventListener('click', function () {
        resetScene();
      });
      var gi = document.getElementById('glyphInput');
      if (gi) {
        gi.addEventListener('input', function () {
          var cleaned = (gi.value || '').replace(/[^A-Za-z]/g, '');
          if (cleaned.length > 12) cleaned = cleaned.slice(0, 12);
          if (gi.value !== cleaned) gi.value = cleaned;
          if (!cleaned.length) return;
          if (!phase4.isBreaking) prepareGlyph(cleaned);
        });
        gi.addEventListener('change', function () {
          if (!phase4.isBreaking) prepareGlyph(getGlyph());
        });
      }
      syncBreakButtonState();
    }

    function draw() {
      background(228);

      if (PAGE3_MODE) {
        var lsDraw = width / VENN_REF.layoutRefW;
        var vTargets = getVennTargets();
        var top = vTargets[0];
        var left = vTargets[1];
        var right = vTargets[2];
        var d = phase4.r * 2;
        var showAll = page3View === 2;

        noStroke();
        fill(245, 120);
        if (showAll) {
          ellipse(left.x, left.y, d, d);
          ellipse(right.x, right.y, d, d);
        }
        ellipse(top.x, top.y, d, d);

        noFill();
        stroke(120, 220);
        strokeWeight(3 * lsDraw);
        strokeJoin(ROUND);
        strokeCap(ROUND);
        if (showAll) {
          ellipse(left.x, left.y, d, d);
          ellipse(right.x, right.y, d, d);
        }
        ellipse(top.x, top.y, d, d);
      }

      if (!specFontGlyphPrimed && !phase4.isBreaking) {
        if (specFontReady() || frameCount > 180) {
          prepareGlyph(getGlyph());
          specFontGlyphPrimed = true;
        }
      }

      if (world && particleSystem) {
        // Do not Step before break: g=0 still runs particle-particle pressure/contact
        // every frame, which injects motion into a dense glyph. Freeze sim until release.
        if (phase4.isBreaking) {
          for (var s = 0; s < CFG.simSpeed; s++) {
            world.Step(1 / 60, CFG.stepVelIters, CFG.stepPosIters);
            if (CFG.airDrag > 0 || CFG.upwardExtraDrag > 0) {
              var v = particleSystem.GetVelocityBuffer();
              if (v && v.length >= 2) {
                for (var vi = 0; vi < v.length; vi += 2) {
                  var extra = v[vi + 1] > 0 ? CFG.upwardExtraDrag : 0;
                  var mul = Math.max(0, 1 - CFG.airDrag - extra);
                  v[vi] *= mul;
                  v[vi + 1] *= mul;
                }
              }
            }
            applyFallStaggerPins();
          }
        }

        var pos = particleSystem.GetPositionBuffer();
        var vel = particleSystem.GetVelocityBuffer();
        var r = particleSystem.radius;
        var useIsolatedSpeckClip = PAGE3_MODE && page3View === 2;
        var cTargets = useIsolatedSpeckClip ? getVennTargets() : null;

        noStroke();
        var particleOpacityMul = 1;
        if (!phase4.isBreaking) {
          particleOpacityMul = constrain(CFG.preBreakParticleOpacity, 0, 1);
        } else if (phase4.breakFadeStartMs >= 0) {
          var dur = Math.max(1, CFG.postBreakFadeInMs);
          var u = (millis() - phase4.breakFadeStartMs) / dur;
          particleOpacityMul = u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
        }
        var releasedBottomSy = -1e9;
        for (var i = 0; i < pos.length; i += 2) {
          var sx = pos[i];
          var sy = -pos[i + 1];
          var vx = vel[i];
          var vy = vel[i + 1];
          var speed = Math.hypot(vx, vy);
          var alpha = constrain(
            CFG.particleAlphaBase + speed * CFG.particleAlphaSpeedScale,
            CFG.particleAlphaMin,
            CFG.particleAlphaMax
          );
          alpha = constrain(alpha * particleOpacityMul, 0, 255);
          var j = (i >> 1) % 7;
          var vr = 1 + j * 0.02;
          var gc = phase4.glyphRgb;
          if (useIsolatedSpeckClip && !pointInIsolatedSpeckRegion(sx, sy, cTargets, phase4.r)) {
            continue;
          }
          if (PAGE3_MODE) alpha = 255;
          fill(gc.r, gc.g, gc.b, alpha);
          circle(sx, sy, r * 2 * vr);

          if (PAGE3_MODE && phase4.isBreaking && phase4.fallReleaseAtMs && millis() >= phase4.fallReleaseAtMs[i >> 1]) {
            if (sy > releasedBottomSy) releasedBottomSy = sy;
          }
        }

        if (PAGE3_MODE && phase4.isBreaking && phase4.firstBottomHitMs < 0 && releasedBottomSy > -1e8) {
          // Slightly inside the wall to avoid never-hitting due solver jitter/packing.
          var hitY = phase4.cy + phase4.r * 0.86;
          if (releasedBottomSy >= hitY) {
            phase4.firstBottomHitMs = millis();
          }
        }

        // Breaking: glyph color on top of particles — alpha-only fade (no dark outline pass here).
        if (phase4.isBreaking && phase4.glyphMaskGfx && phase4.fallLastReleaseMs >= 0) {
          var t0g = phase4.breakFadeStartMs;
          var t1g = phase4.fallLastReleaseMs + Math.max(0, CFG.glyphFadeOutTailMs);
          var nowg = millis();
          var glyphRemain = 1;
          if (nowg >= t1g) glyphRemain = 0;
          else if (nowg > t0g) {
            var ug = (nowg - t0g) / Math.max(1, t1g - t0g);
            var sg = ug * ug * (3 - 2 * ug);
            glyphRemain = 1 - sg;
          }
          if (glyphRemain > 0) {
            var followDy = computeGlyphFollowDy(millis());
            var faBr = Math.round(255 * glyphRemain);
            if (useIsolatedSpeckClip) {
              drawingContext.save();
              drawingContext.beginPath();
              drawingContext.arc(cTargets[0].x, cTargets[0].y, phase4.r * 0.995, 0, Math.PI * 2);
              drawingContext.clip();
              drawGlyphSilhouetteImage(0, faBr, followDy);
              drawingContext.restore();
            } else {
              drawGlyphSilhouetteImage(0, faBr, followDy);
            }
          }
        }
      }

      // Pre-break: solid glyph on top of particles.
      if (!phase4.isBreaking && phase4.glyphMaskGfx) {
        if (PAGE3_MODE && page3View === 2) {
          var preTargets = getVennTargets();
          drawingContext.save();
          drawingContext.beginPath();
          drawingContext.arc(preTargets[0].x, preTargets[0].y, phase4.r * 0.995, 0, Math.PI * 2);
          drawingContext.clip();
          drawGlyphSilhouetteImage(CFG.silhouetteOutlineAlpha, CFG.silhouetteFillAlpha);
          drawingContext.restore();
        } else {
          drawGlyphSilhouetteImage(CFG.silhouetteOutlineAlpha, CFG.silhouetteFillAlpha);
        }
      }

      if (PAGE3_MODE) {
        if (!phase4.isBreaking && phase4.sceneReadyAtMs > 0 && autoBreakAtMs < 0) {
          autoBreakAtMs = phase4.sceneReadyAtMs + AUTO_BREAK_DELAY_MS;
        }
        if (!phase4.isBreaking && autoBreakAtMs > 0 && millis() >= autoBreakAtMs) {
          startGlyphDisintegration(getGlyph());
          autoBreakAtMs = -1;
        }
        if (phase4.isBreaking && phase4.firstBottomHitMs > 0) {
          if (millis() - phase4.firstBottomHitMs >= RESET_AFTER_BOTTOM_HIT_MS) {
            resetScene();
          }
        } else if (phase4.isBreaking && phase4.breakStartMs > 0) {
          // Fallback safety: never stall if bottom-hit event is missed.
          if (millis() - phase4.breakStartMs >= 9000) {
            resetScene();
          }
        }
      }
    }
  </script>
</body>
</html>
