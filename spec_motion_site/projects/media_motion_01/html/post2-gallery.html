<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Venn Diagram (Frames)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="../js/inkBlob.js"></script>
  <style>
    :root {
      --bg:     #e6e6e6;
      --ink:    #141414;
      --border: rgba(0, 0, 0, 0.14);
      --muted:  rgba(0, 0, 0, 0.42);
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
    }

    .demo-root {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .frame-stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      align-self: stretch;
      overflow: hidden;
      box-sizing: border-box;
    }

    .demo-main {
      width: 50%;
      max-width: 100%;
      margin: 0 auto;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-sizing: border-box;
      padding-top: max(18px, env(safe-area-inset-top, 0px));
      padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
      padding-left: max(10px, env(safe-area-inset-left, 0px));
      padding-right: max(10px, env(safe-area-inset-right, 0px));
    }

    .still-sections {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: auto;
      padding: 14px;
      gap: 14px;
      align-content: start;
    }

    .still-section {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      min-height: 0;
    }

    .still-section-title {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .still-grid {
      display: grid;
      width: 100%;
      min-height: 0;
      gap: 10px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(120px, 1fr));
    }

    .still-cell {
      border: 0.5px solid var(--border);
      background: rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .still-cell iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      pointer-events: none;
      background: transparent;
    }

    .is-grid-slide .still-sections {
      display: grid;
      width: 100%;
      height: 100%;
      padding: 14px;
      grid-auto-rows: minmax(0, auto);
    }

    .is-grid-slide .demo-main canvas {
      display: none !important;
    }

    .is-grid-slide .demo-main {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(20, 20, 20, 0.5);
      transition: color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .gallery-arrow--prev {
      left: max(10px, env(safe-area-inset-left, 0px));
    }

    .gallery-arrow--next {
      right: max(10px, env(safe-area-inset-right, 0px));
    }

    .gallery-arrow:hover {
      color: #141414;
      background: rgba(0, 0, 0, 0.05);
    }

    .gallery-arrow svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    /*
     * Fill the stage and letterbox the bitmap (4:5). Do not use width/height: auto !important —
     * that overrides p5’s inline logical size and uses wrong intrinsic sizing inside the hub iframe.
     */
    .demo-main canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      object-position: center;
    }

    main { display: block; }

    .demo-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      border-top: 0.5px solid var(--border);
      user-select: none;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .slide-title {
      color: var(--ink);
      font-weight: 500;
    }

    .slide-idx {
      opacity: 0.75;
    }

    /* Hub iframe / phone: use full width so the 4:5 canvas fits `main` (was 50% → tiny Venn). */
    @media (max-width: 768px) {
      .demo-main {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .demo-toolbar { padding: 10px 12px; }
      .demo-toolbar { font-size: 0.82rem; }
      .still-sections { padding: 10px; gap: 10px; }
      .still-grid { gap: 8px; }
    }

    @media (max-width: 768px) {
      .still-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(110px, 1fr));
      }
    }

    .is-locked .gallery-arrow,
    .is-locked .demo-toolbar {
      display: none;
    }
  </style>
</head>

<body>
  <div class="demo-root">
    <div class="frame-stage">
      <main class="demo-main">
        <div id="stillSections" class="still-sections" aria-label="Still image sections">
          <section class="still-section" aria-label="Still images grid 1">
            <div class="still-section-title">Still images 1 of 2</div>
            <div class="still-grid">
              <div class="still-cell" title="Frame 1">
                <iframe title="Venn frame 1 still" src="about:blank" loading="lazy" data-src="post2-gallery.html?max=5&amp;lock=1#venn-frame-1"></iframe>
              </div>
              <div class="still-cell" title="Frame 2">
                <iframe title="Venn frame 2 still" src="about:blank" loading="lazy" data-src="post2-gallery.html?max=5&amp;lock=1#venn-frame-2"></iframe>
              </div>
              <div class="still-cell" title="Frame 3 (zoomed speck)">
                <iframe title="Venn frame 3 still" src="about:blank" loading="lazy" data-src="post2-gallery.html?max=5&amp;lock=1#venn-frame-3"></iframe>
              </div>
              <div class="still-cell" title="Frame 4 (speck ∩ spectrum)">
                <iframe title="Venn frame 4 overlap still" src="about:blank" loading="lazy" data-src="post2-gallery.html?lock=1&amp;overlapStill=1#venn-overlap"></iframe>
              </div>
              <div class="still-cell" title="Frame 5 (inspect ∩ spectrum pair)">
                <iframe title="Venn frame 5 media pair still" src="about:blank" loading="lazy" data-src="post2-gallery.html?lock=1&amp;mediaPairStill=1#venn-media-pair"></iframe>
              </div>
              <div class="still-cell" title="Frame 6 (speck ∩ inspect · space)">
                <iframe title="Venn frame 6 space phrases still" src="about:blank" loading="lazy" data-src="post2-gallery.html?lock=1&amp;spacePhrasesStill=1#venn-space-phrases"></iframe>
              </div>
            </div>
          </section>
          <section class="still-section" aria-label="Still images grid 2">
            <div class="still-section-title">Still images 2 of 2</div>
            <div class="still-grid">
              <div class="still-cell" title="Frame 7">
                <iframe title="Venn frame 1 still alt" src="about:blank" loading="lazy" data-src="post2-gallery.html?max=5&amp;lock=1#venn-frame-1"></iframe>
              </div>
              <div class="still-cell" title="Frame 8">
                <iframe title="Venn frame 2 still alt" src="about:blank" loading="lazy" data-src="post2-gallery.html?max=5&amp;lock=1#venn-frame-2"></iframe>
              </div>
              <div class="still-cell" title="Frame 9">
                <iframe title="Venn frame 3 still alt" src="about:blank" loading="lazy" data-src="post2-gallery.html?max=5&amp;lock=1#venn-frame-3"></iframe>
              </div>
              <div class="still-cell" title="Frame 10">
                <iframe title="Venn frame 4 overlap still alt" src="about:blank" loading="lazy" data-src="post2-gallery.html?lock=1&amp;overlapStill=1#venn-overlap"></iframe>
              </div>
              <div class="still-cell" title="Frame 11">
                <iframe title="Venn frame 5 media pair still alt" src="about:blank" loading="lazy" data-src="post2-gallery.html?lock=1&amp;mediaPairStill=1#venn-media-pair"></iframe>
              </div>
              <div class="still-cell" title="Frame 12">
                <iframe title="Venn frame 6 space phrases still alt" src="about:blank" loading="lazy" data-src="post2-gallery.html?lock=1&amp;spacePhrasesStill=1#venn-space-phrases"></iframe>
              </div>
            </div>
          </section>
        </div>
      </main>
      <button type="button" class="gallery-arrow gallery-arrow--prev" id="galleryPrev" aria-label="Previous frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" class="gallery-arrow gallery-arrow--next" id="galleryNext" aria-label="Next frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="demo-toolbar">
      <span id="slideTitle" class="slide-title">Venn frame</span>
      <span id="counter" class="slide-idx">1 / 5</span>
    </div>
  </div>
  <script>
    window.__SPEC_GALLERY__ = true;

    const params = new URLSearchParams(location.search);
    window.__SPEC_OVERLAP_STILL__ = params.get('overlapStill') === '1';
    window.__SPEC_SPECTRUM_STILL__ = params.get('spectrumStill') === '1';
    window.__SPEC_INSPECT_STILL__ = params.get('inspectStill') === '1';
    window.__SPEC_MEDIA_PAIR_STILL__ = params.get('mediaPairStill') === '1';
    window.__SPEC_SPACE_PHRASES_STILL__ = params.get('spacePhrasesStill') === '1';
    window.__SPEC_STILL03__ = params.get('still03') === '1';
    window.__SPEC_ALL_PHRASES_STILL__ = params.get('allPhrasesStill') === '1';
    window.__SPEC_ALL_OVERLAP_TEXTS_STILL__ = params.get('allOverlapTextsStill') === '1';
    window.__SPEC_LOGO_STILL__ = params.get('logoStill') === '1';
    window.__SPEC_MOTION_SEGMENT__ = params.get('motionSegment') || '';
    window.__SPEC_GALLERY2_SHELL__ = params.get('gallery2Shell') === '1';
    window.__SPEC_LIVE_MOTIONS_DESIGN__ = params.get('liveMotionsDesign') === '1';
    window.__SPEC_LIVE_MOTIONS_27__ = params.get('liveMotions27') === '1';
    /** `motionSegment=23` only: skip 1→2→zoom; start at zoomed speck (sediment / POST2 timing uses wall clock from load). */
    window.__SPEC_MOTION_ZOOMED_IN_START__ = params.get('motionZoomedIn') === '1';
    /** `motionSegment=45` + **`liveMotions27`**: start at post-rotation Still 05 pose; only phrase fade / loop timing (no spin). */
    window.__SPEC_MOTION_SPECTRUM_SETTLED__ = params.get('motionSpectrumSettled') === '1';
    /** `motionSegment=78` without **`liveMotions27`**: same as settled when **`1`** (hub 2.5). */
    window.__SPEC_MOTION_SPACE_SETTLED__ = params.get('motionSpaceSettled') === '1';
    /** `motionSegment=78` + **`liveMotions27`**: opt **in** to full −120° rotation (default is settled). */
    window.__SPEC_MOTION_SPACE_ROTATION__ = params.get('motionSpaceRotation') === '1';
    /** `motionSegment=78` + hub **2.7** full rotation: play **once**, then **`noLoop()`** (no **`galleryAnimStartMs`** reset). */
    window.__SPEC_MOTION_SPACE_ROTATION_NO_LOOP__ = params.get('motionSpaceRotationNoLoop') === '1';
    /** `motionSegment=67` hub duplicate: animated **inspect** label + optional inspect-exclusive debug alpha. */
    window.__SPEC_INSPECT_ANIM_LABEL__ = params.get('inspectAnimLabel') === '1';
    if (params.has('inspectExclusiveDebugAlpha')) {
      const a = Number(params.get('inspectExclusiveDebugAlpha'));
      window.__SPEC_INSPECT_EXCLUSIVE_DEBUG_ALPHA__ = Number.isFinite(a) ? a : 128;
    }
    const EXTENDED_MODE = params.get('max') === '5';
    window.__SPEC_GALLERY_EXTENDED__ = EXTENDED_MODE;
    const FRAME_HASH_TO_NUM = EXTENDED_MODE
      ? {
          'venn-frame-1': 1,
          'venn-frame-2': 2,
          'venn-frame-3': 3,
          'venn-frame-4': 4,
          'venn-frame-5': 5,
        }
      : {
          'venn-frame-1': 1,
          'venn-frame-2': 1,
          'venn-frame-3': 2,
          'venn-stills': 1,
          'venn-motion': 2,
          'venn-overlap': 3,
          'venn-media-pair': 4,
          'venn-space-phrases': 5,
        };
    const TOTAL_FRAMES = EXTENDED_MODE ? 5 : 5;
    // Compact: sketch 1,3,4,5,6; extended UI 1–5 maps 1:1 to sketch 1–5 (ink on 4–5).
    window.__SPEC_GALLERY_MAX_FRAME = 6;
    const counterEl = document.getElementById('counter');
    const titleEl = document.getElementById('slideTitle');
    let lastUiFrame = 0;
    const FRAME_TITLES = EXTENDED_MODE
      ? ['Venn frame 1', 'Venn frame 2', 'Venn frame 3', 'Venn frame 4', 'Venn frame 5']
      : ['Still images', 'Live motions · zoom motion', 'Live motions · speck ∩ spectrum', 'Live motions · inspect ∩ spectrum', 'Live motions · speck ∩ inspect · space'];

    function clampFrame(n) {
      return Math.max(1, Math.min(TOTAL_FRAMES, n | 0));
    }

    const LOCK_MODE = params.get('lock') === '1';

    function readFrameFromHash() {
      const raw = (location.hash || '').replace(/^#/, '').trim().toLowerCase();
      if (FRAME_HASH_TO_NUM[raw] && FRAME_HASH_TO_NUM[raw] <= TOTAL_FRAMES) return FRAME_HASH_TO_NUM[raw];
      return 1;
    }

    function setHashForFrame(f) {
      const h = EXTENDED_MODE
        ? `venn-frame-${f}`
        : (f === 1 ? 'venn-stills' : f === 2 ? 'venn-motion' : f === 3 ? 'venn-overlap' : f === 4 ? 'venn-media-pair' : 'venn-space-phrases');
      if (location.hash !== `#${h}`) {
        history.replaceState(null, '', `${location.pathname}${location.search}#${h}`);
      }
    }

    function syncSketchFrame(uiFrame) {
      if (EXTENDED_MODE) {
        window.__SPEC_GALLERY_FRAME__ = uiFrame;
      } else {
        // Compact: 1→1, 2→3, 3→4, 4→5, 5→6.
        window.__SPEC_GALLERY_FRAME__ = uiFrame === 1 ? 1 : uiFrame === 2 ? 3 : uiFrame === 3 ? 4 : uiFrame === 4 ? 5 : 6;
      }
    }

    function applyGridState(uiFrame) {
      document.body.classList.toggle('is-grid-slide', !EXTENDED_MODE && uiFrame === 1);
    }

    /** Load still-grid iframes only on slide 1, staggered (avoids 6× p5+Matter+sketch at once). */
    let stillGridEmbedsStarted = false;
    function scheduleStillGridEmbeds() {
      if (EXTENDED_MODE || stillGridEmbedsStarted) return;
      const gridRoot = document.getElementById('stillSections');
      if (!gridRoot) return;
      const frames = gridRoot.querySelectorAll('iframe[data-src]');
      if (!frames.length) return;
      stillGridEmbedsStarted = true;
      let i = 0;
      const staggerMs = 55;
      const step = () => {
        if (i >= frames.length) return;
        const el = frames[i++];
        const url = el.getAttribute('data-src');
        if (url) {
          el.src = url;
          el.removeAttribute('data-src');
        }
        setTimeout(step, staggerMs);
      };
      requestAnimationFrame(step);
    }

    function updateUI() {
      const uiFrame = window.__SPEC_UI_FRAME__ || 1;
      counterEl.textContent = `${uiFrame} / ${TOTAL_FRAMES}`;
      if (titleEl) titleEl.textContent = FRAME_TITLES[uiFrame - 1] || 'Venn frame';
      applyGridState(uiFrame);
      syncSketchFrame(uiFrame);
      if (!EXTENDED_MODE && uiFrame === 1) {
        scheduleStillGridEmbeds();
      }
      if (!EXTENDED_MODE && uiFrame === 2 && lastUiFrame !== 2) {
        window.__SPEC_FORCE_MOTION_RESTART__ = true;
        if (typeof window.loop === 'function') window.loop();
      }
      if (!EXTENDED_MODE && uiFrame === 3 && lastUiFrame !== 3) {
        if (typeof window.loop === 'function') window.loop();
      }
      if (!EXTENDED_MODE && uiFrame === 4 && lastUiFrame !== 4) {
        if (typeof window.loop === 'function') window.loop();
      }
      if (!EXTENDED_MODE && uiFrame === 5 && lastUiFrame !== 5) {
        if (typeof window.loop === 'function') window.loop();
      }
      setHashForFrame(uiFrame);
      lastUiFrame = uiFrame;
    }

    function gotoFrame(delta) {
      if (LOCK_MODE) return;
      const cur = window.__SPEC_UI_FRAME__ || 1;
      const f = clampFrame(cur + delta);
      window.__SPEC_UI_FRAME__ = f;
      updateUI();
      if (typeof window.redraw === 'function') window.redraw();
    }

    document.getElementById('galleryPrev').addEventListener('click', () => gotoFrame(-1));
    document.getElementById('galleryNext').addEventListener('click', () => gotoFrame(1));
    window.addEventListener('keydown', (e) => {
      if (LOCK_MODE) return;
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        gotoFrame(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        gotoFrame(1);
      }
    });

    window.addEventListener('hashchange', () => {
      // Parent shells (e.g. galleries/post1-2-gallery-2) often change only the URL fragment on the same
      // iframe src; the document may not reload, so we must sync from the hash even when inner
      // navigation is locked (arrows/keys stay disabled via gotoFrame).
      const f = readFrameFromHash();
      if (f !== (window.__SPEC_UI_FRAME__ || 1)) {
        window.__SPEC_UI_FRAME__ = f;
        updateUI();
        if (typeof window.redraw === 'function') window.redraw();
      }
    });

    window.__SPEC_UI_FRAME__ = readFrameFromHash();
    if (LOCK_MODE) document.body.classList.add('is-locked');
    updateUI();
  </script>
  <script src="../js/modules/easing.js"></script>
  <script src="../js/modules/featureFlags.js"></script>
  <script src="../js/modules/inspectReader.js"></script>
  <script src="../js/modules/vennGeometry.js"></script>
  <script src="../js/modules/spectrumReader.js"></script>
  <script src="../js/sketch.js"></script>
</body>

</html>
