<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Venn Diagram (Frames)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="../js/inkBlob.js"></script>
  <style>
    :root {
      --bg:     #e6e6e6;
      --ink:    #141414;
      --border: rgba(0, 0, 0, 0.14);
      --muted:  rgba(0, 0, 0, 0.42);
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
    }

    .demo-root {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .frame-stage {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 50%;
      max-width: 100%;
      align-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-sizing: border-box;
      padding-top: max(18px, env(safe-area-inset-top, 0px));
      padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
      padding-left: max(10px, env(safe-area-inset-left, 0px));
      padding-right: max(10px, env(safe-area-inset-right, 0px));
    }

    /* Row: arrows sit beside the canvas strip (LiquidFun-style controls), not the 50% column edges. */
    .gallery-content {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: 0;
      min-width: 0;
      gap: 4px;
    }

    .gallery-content .demo-main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gallery-arrow {
      position: relative;
      z-index: 4;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      align-self: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(20, 20, 20, 0.5);
      transition: color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .gallery-arrow:hover {
      color: #141414;
      background: rgba(0, 0, 0, 0.05);
    }

    .gallery-arrow svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    /*
     * Fill the stage and letterbox the bitmap (4:5). Do not use width/height: auto !important —
     * that overrides p5’s inline logical size and uses wrong intrinsic sizing inside the hub iframe.
     */
    .demo-main canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      object-position: center;
    }

    main { display: block; }

    .demo-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      border-top: 0.5px solid var(--border);
      user-select: none;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .slide-title {
      color: var(--ink);
      font-weight: 500;
    }

    .slide-idx {
      opacity: 0.75;
    }

    /* Hub iframe / phone: use full width so the 4:5 canvas fits `main` (was 50% → tiny Venn). */
    @media (max-width: 768px) {
      .frame-stage {
        width: 100%;
        max-width: 100%;
        align-self: stretch;
      }
    }

    @media (max-width: 520px) {
      .demo-toolbar { padding: 10px 12px; }
      .demo-toolbar { font-size: 0.82rem; }
    }
  </style>
</head>

<body>
  <div class="demo-root">
    <div class="frame-stage">
      <div class="gallery-content">
        <button type="button" class="gallery-arrow gallery-arrow--prev" id="galleryPrev" aria-label="Previous frame">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <main class="demo-main"></main>
        <button type="button" class="gallery-arrow gallery-arrow--next" id="galleryNext" aria-label="Next frame">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="demo-toolbar">
      <span id="slideTitle" class="slide-title">Venn frame</span>
      <span id="counter" class="slide-idx">1 / 5</span>
    </div>
  </div>
  <script>
    window.__SPEC_GALLERY__ = true;
    window.__SPEC_GALLERY_FRAME__ = 1;

    const TOTAL_FRAMES = 5;
    const counterEl = document.getElementById('counter');
    const titleEl = document.getElementById('slideTitle');
    const FRAME_TITLES = [
      'Venn frame 1',
      'Venn frame 2',
      'Venn frame 3',
      'Venn frame 4',
      'Venn frame 5',
    ];

    function updateUI() {
      const f = window.__SPEC_GALLERY_FRAME__ || 1;
      counterEl.textContent = `${f} / ${TOTAL_FRAMES}`;
      if (titleEl) titleEl.textContent = FRAME_TITLES[f - 1] || 'Venn frame';
    }

    function gotoFrame(delta) {
      const cur = window.__SPEC_GALLERY_FRAME__ || 1;
      const f = Math.max(1, Math.min(TOTAL_FRAMES, cur + delta));
      window.__SPEC_GALLERY_FRAME__ = f;
      updateUI();
      if (typeof window.redraw === 'function') window.redraw();
    }

    document.getElementById('galleryPrev').addEventListener('click', () => gotoFrame(-1));
    document.getElementById('galleryNext').addEventListener('click', () => gotoFrame(1));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        gotoFrame(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        gotoFrame(1);
      }
    });
    updateUI();
  </script>
  <script src="../js/sketch.js"></script>
</body>

</html>
